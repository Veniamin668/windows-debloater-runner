name: Windows Debloater
description: Aggressive Windows runner cleanup with selected development tools preserved
author: Veniamin668

branding:
  icon: trash-2
  color: red

inputs:
  enable:
    description: Enable Windows runner debloating
    required: false
    default: 'true'

  remove_services:
    description: Stop and remove unwanted Windows services
    required: false
    default: 'true'

runs:
  using: composite
  steps:

    # ============================================================
    # CHECK
    # ============================================================

    - name: Check settings
      if: inputs.enable == 'true'
      shell: pwsh
      run: |
        Write-Host "============================================================"
        Write-Host " WINDOWS DEBLOATER"
        Write-Host "============================================================"
        Write-Host "[ENABLE]          $env:ENABLE"
        Write-Host "[REMOVE SERVICES] $env:REMOVE_SERVICES"
        Write-Host ""

      env:
        ENABLE: ${{ inputs.enable }}
        REMOVE_SERVICES: ${{ inputs.remove_services }}


    # ============================================================
    # STOP UNWANTED SERVICES
    # ============================================================

    - name: Stop unwanted services
      if: inputs.enable == 'true' && inputs.remove_services == 'true'
      shell: pwsh
      run: |
        $services = @(
          'postgresql-x64-17',
          'PostgreSQL',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'hpatchmon',
          'ZTHELPER'
        )

        Write-Host "============================================================"
        Write-Host " STOPPING UNWANTED SERVICES"
        Write-Host "============================================================"

        foreach ($serviceName in $services) {
          try {
            $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue

            if ($null -eq $service) {
              continue
            }

            Write-Host "[SERVICE] $serviceName - $($service.Status)"

            if ($service.Status -ne 'Stopped') {
              Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
              Write-Host "[STOPPED] $serviceName"
            }
          }
          catch {
            Write-Host "[WARN] Failed to stop $serviceName : $($_.Exception.Message)"
          }
        }


    # ============================================================
    # STOP UNWANTED PROCESSES
    # ============================================================

    - name: Stop unwanted processes
      if: inputs.enable == 'true'
      shell: pwsh
      run: |
        $processes = @(
          'postgres',
          'postgresql',
          'mongod',
          'mongo',
          'httpd',
          'nginx',
          'mysqld',
          'mysql',
          'w3wp',
          'java',
          'javaw',
          'python',
          'python3',
          'conda',
          'ruby',
          'perl',
          'dotnet'
        )

        Write-Host "============================================================"
        Write-Host " STOPPING UNWANTED PROCESSES"
        Write-Host "============================================================"

        foreach ($name in $processes) {
          try {
            $running = Get-Process -Name $name -ErrorAction SilentlyContinue

            if ($running) {
              Write-Host "[PROCESS] Stopping $name"

              $running | Stop-Process -Force -ErrorAction SilentlyContinue

              Write-Host "[STOPPED] $name"
            }
          }
          catch {
            Write-Host "[WARN] Failed to stop $name : $($_.Exception.Message)"
          }
        }


    # ============================================================
    # CHOCOLATEY CLEANUP
    # ============================================================

    - name: Remove unwanted Chocolatey packages
      if: inputs.enable == 'true'
      shell: pwsh
      run: |

        $ErrorActionPreference = 'Continue'

        Write-Host ""
        Write-Host "============================================================"
        Write-Host " CHOCOLATEY PACKAGE CLEANUP"
        Write-Host "============================================================"

        $choco = Get-Command choco.exe -ErrorAction SilentlyContinue

        if ($null -eq $choco) {
          Write-Host "[INFO] Chocolatey is not installed."
          exit 0
        }

        Write-Host "[CHOCO] $($choco.Source)"
        Write-Host ""

        # --------------------------------------------------------
        # CHOCOLATEY ALLOWLIST
        # --------------------------------------------------------

        $allowPatterns = @(

          # Firefox
          '^firefox($|-)',

          # 7-Zip
          '^7zip($|-)',

          # CMake
          '^cmake($|-)',

          # Visual Studio and all VS components/workloads
          '^visualstudio',
          '^visual-studio',
          '^vs-',

          # Git / Git for Windows / Git Credential Manager
          '^git($|-)',
          '^git-for-windows($|-)',
          '^git-credential-manager($|-)',
          '^gcm($|-)',

          # GitHub CLI
          '^gh($|-)',
          '^github-cli($|-)',

          # Tailscale
          '^tailscale($|-)',

          # Docker
          '^docker($|-)',
          '^docker-desktop($|-)',
          '^docker-cli($|-)',
          '^docker-compose($|-)',

          # WSL and distributions
          '^wsl($|-)',
          '^wsl2($|-)',
          '^ubuntu($|-)',
          '^debian($|-)',
          '^kali($|-)',
          '^oraclelinux($|-)',
          '^opensuse($|-)',
          '^open-suse($|-)',
          '^suse($|-)',

          # Kubernetes
          '^kubernetes($|-)',
          '^kubectl($|-)',
          '^minikube($|-)',
          '^kind($|-)',

          # Node.js
          '^nodejs($|-)',
          '^nodejs-lts($|-)',
          '^npm($|-)',
          '^npx($|-)',

          # PowerShell
          '^powershell-core($|-)',
          '^powershell($|-)',
          '^pwsh($|-)'
        )

        function Test-ChocoAllowlist {
          param(
            [string]$PackageId
          )

          foreach ($pattern in $allowPatterns) {
            if ($PackageId -match $pattern) {
              return $true
            }
          }

          return $false
        }


        # --------------------------------------------------------
        # GET INSTALLED PACKAGES
        # --------------------------------------------------------

        Write-Host "[CHOCO] Reading installed packages..."
        Write-Host ""

        $lines = @(
          & choco.exe list --local-only --limit-output 2>$null
        )

        $packages = @()

        foreach ($line in $lines) {

          if ([string]::IsNullOrWhiteSpace($line)) {
            continue
          }

          if ($line -notmatch '^([^|]+)\|(.+)$') {
            continue
          }

          $id = $Matches[1].Trim()
          $version = $Matches[2].Trim()

          if ([string]::IsNullOrWhiteSpace($id)) {
            continue
          }

          $packages += [PSCustomObject]@{
            Id      = $id
            Version = $version
          }
        }

        if ($packages.Count -eq 0) {
          Write-Host "[INFO] No Chocolatey packages detected."
          exit 0
        }

        Write-Host "[CHOCO] Installed packages: $($packages.Count)"
        Write-Host ""


        # --------------------------------------------------------
        # PRINT FULL PACKAGE LIST
        # --------------------------------------------------------

        Write-Host "---------------- INSTALLED CHOCOLATEY PACKAGES ----------------"

        foreach ($package in $packages) {

          if (Test-ChocoAllowlist $package.Id) {
            Write-Host "[KEEP]   $($package.Id) $($package.Version)"
          }
          else {
            Write-Host "[REMOVE] $($package.Id) $($package.Version)"
          }
        }

        Write-Host "---------------------------------------------------------------"
        Write-Host ""


        # --------------------------------------------------------
        # REMOVE PACKAGES ONE BY ONE
        # --------------------------------------------------------

        $remove = @(
          $packages |
            Where-Object {
              -not (Test-ChocoAllowlist $_.Id)
            }
        )

        Write-Host "[CHOCO] Packages to remove: $($remove.Count)"
        Write-Host ""

        foreach ($package in $remove) {

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "[CHOCO REMOVE] $($package.Id) $($package.Version)"
          Write-Host "============================================================"

          try {

            & choco.exe uninstall $package.Id `
              -y `
              --force `
              --no-progress

            $exitCode = $LASTEXITCODE

            Write-Host "[EXIT CODE] $exitCode"

            if ($exitCode -eq 0) {
              Write-Host "[REMOVED] $($package.Id)"
            }
            else {
              Write-Host "[FAIL] Chocolatey failed to remove $($package.Id)"
            }

          }
          catch {

            Write-Host "[FAIL] Exception while removing $($package.Id)"
            Write-Host "[ERROR] $($_.Exception.Message)"
          }
        }

        Write-Host ""
        Write-Host "============================================================"
        Write-Host " CHOCOLATEY CLEANUP FINISHED"
        Write-Host "============================================================"


    # ============================================================
    # EDGE / WEBVIEW2 SPECIAL REMOVAL
    # ============================================================

    - name: Remove Microsoft Edge and WebView2
      if: inputs.enable == 'true'
      shell: pwsh
      run: |

        Write-Host "============================================================"
        Write-Host " MICROSOFT EDGE / WEBVIEW2 CLEANUP"
        Write-Host "============================================================"

        $setupPaths = @()

        $edgeRoots = @(
          'C:\Program Files (x86)\Microsoft\Edge\Application',
          'C:\Program Files\Microsoft\Edge\Application'
        )

        foreach ($root in $edgeRoots) {

          if (-not (Test-Path -LiteralPath $root)) {
            continue
          }

          Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
            ForEach-Object {

              $installer = Join-Path $_.FullName 'Installer\setup.exe'

              if (Test-Path -LiteralPath $installer) {
                $setupPaths += $installer
              }
            }
        }

        $setupPaths = $setupPaths | Select-Object -Unique

        foreach ($setup in $setupPaths) {

          Write-Host ""
          Write-Host "[EDGE] Found:"
          Write-Host "       $setup"

          try {

            $process = Start-Process `
              -FilePath $setup `
              -ArgumentList @(
                '--uninstall',
                '--system-level',
                '--force-uninstall'
              ) `
              -Wait `
              -PassThru `
              -NoNewWindow `
              -ErrorAction Stop

            Write-Host "[EDGE] Exit code: $($process.ExitCode)"

          }
          catch {

            Write-Host "[WARN] Edge uninstall failed:"
            Write-Host "       $($_.Exception.Message)"
          }
        }


        # --------------------------------------------------------
        # WEBVIEW2
        # --------------------------------------------------------

        $webviewRoots = @(
          'C:\Program Files (x86)\Microsoft\EdgeWebView\Application',
          'C:\Program Files\Microsoft\EdgeWebView\Application'
        )

        foreach ($root in $webviewRoots) {

          if (-not (Test-Path -LiteralPath $root)) {
            continue
          }

          Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
            ForEach-Object {

              $installer = Join-Path $_.FullName 'Installer\setup.exe'

              if (Test-Path -LiteralPath $installer) {

                Write-Host ""
                Write-Host "[WEBVIEW2] Found:"
                Write-Host "           $installer"

                try {

                  $process = Start-Process `
                    -FilePath $installer `
                    -ArgumentList @(
                      '--uninstall',
                      '--msedgewebview',
                      '--system-level',
                      '--force-uninstall'
                    ) `
                    -Wait `
                    -PassThru `
                    -NoNewWindow `
                    -ErrorAction Stop

                  Write-Host "[WEBVIEW2] Exit code: $($process.ExitCode)"

                }
                catch {

                  Write-Host "[WARN] WebView2 uninstall failed:"
                  Write-Host "       $($_.Exception.Message)"
                }
              }
            }
        }


    # ============================================================
    # REGISTRY SOFTWARE DISCOVERY
    # ============================================================

    - name: Remove remaining software from registry
      if: inputs.enable == 'true'
      shell: pwsh
      run: |

        $ErrorActionPreference = 'Continue'

        Write-Host ""
        Write-Host "============================================================"
        Write-Host " REGISTRY SOFTWARE CLEANUP"
        Write-Host "============================================================"

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {

          try {

            $items = Get-ItemProperty $path -ErrorAction SilentlyContinue

            foreach ($item in $items) {

              if ([string]::IsNullOrWhiteSpace($item.DisplayName)) {
                continue
              }

              $apps += $item
            }

          }
          catch {

            Write-Host "[WARN] Registry scan failed: $path"
          }
        }

        $apps = $apps |
          Sort-Object DisplayName, PSPath -Unique

        Write-Host "[REGISTRY] Installed entries: $($apps.Count)"
        Write-Host ""


        # --------------------------------------------------------
        # REGISTRY ALLOWLIST
        # --------------------------------------------------------

        $allowDisplayPatterns = @(

          '^Mozilla Firefox',

          '^Visual Studio',
          '^Microsoft Visual Studio',
          '^Visual Studio Installer',

          '^Git$',
          '^Git for Windows',
          '^Git Credential Manager',
          '^Git LFS',

          '^GitHub CLI',

          '^7-Zip',

          '^CMake',

          '^Tailscale',

          '^Docker',

          '^Windows Subsystem for Linux',
          '^WSL',
          '^Ubuntu',
          '^Debian',
          '^Kali Linux',
          '^Oracle Linux',
          '^openSUSE',
          '^SUSE',

          '^Kubernetes',
          '^kubectl',
          '^Minikube',
          '^kind',

          '^Node\.js',
          '^NodeJS',
          '^npm',
          '^npx',

          '^PowerShell'
        )


        function Test-RegistryAllowlist {
          param(
            [string]$Name
          )

          foreach ($pattern in $allowDisplayPatterns) {

            if ($Name -match $pattern) {
              return $true
            }
          }

          return $false
        }


        # --------------------------------------------------------
        # UNIVERSAL UNINSTALLER HELPERS
        # --------------------------------------------------------

        function Split-ExecutableCommand {
          param(
            [string]$Command
          )

          if ([string]::IsNullOrWhiteSpace($Command)) {
            return $null
          }

          $Command = $Command.Trim()

          $exe = $null
          $arguments = ''

          if ($Command.StartsWith('"')) {

            $endQuote = $Command.IndexOf('"', 1)

            if ($endQuote -gt 0) {

              $exe = $Command.Substring(
                1,
                $endQuote - 1
              )

              if ($Command.Length -gt ($endQuote + 1)) {

                $arguments = $Command.Substring(
                  $endQuote + 1
                ).Trim()
              }
            }
          }
          else {

            if ($Command -match '^(.*?\.exe)(?:\s+(.*))?$') {

              $exe = $Matches[1]

              if ($Matches[2]) {
                $arguments = $Matches[2].Trim()
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($exe)) {
            return $null
          }

          [PSCustomObject]@{
            FilePath  = $exe
            Arguments = $arguments
          }
        }


        function Invoke-ExeUninstaller {
          param(
            [string]$Command,
            [string]$DisplayName
          )

          $parsed = Split-ExecutableCommand -Command $Command

          if ($null -eq $parsed) {

            Write-Host "[WARN] Cannot parse EXE command:"
            Write-Host "       $Command"

            return $false
          }

          $exe = $parsed.FilePath
          $arguments = $parsed.Arguments

          if (-not (Test-Path -LiteralPath $exe)) {

            Write-Host "[WARN] Uninstaller does not exist:"
            Write-Host "       $exe"

            return $false
          }

          Write-Host "[EXE] $exe"

          if ($arguments) {
            Write-Host "[ARGS] $arguments"
          }

          try {

            $argumentList = @()

            if (-not [string]::IsNullOrWhiteSpace($arguments)) {
              $argumentList = @($arguments)
            }

            $process = Start-Process `
              -FilePath $exe `
              -ArgumentList $argumentList `
              -Wait `
              -PassThru `
              -NoNewWindow `
              -ErrorAction Stop

            Write-Host "[EXIT CODE] $($process.ExitCode)"

            return $true
          }
          catch {

            Write-Host "[FAIL] $DisplayName"
            Write-Host "[ERROR] $($_.Exception.Message)"

            return $false
          }
        }


        function Invoke-BatchUninstaller {
          param(
            [string]$Command,
            [string]$DisplayName
          )

          Write-Host "[BAT/CMD] $Command"

          try {

            $process = Start-Process `
              -FilePath 'cmd.exe' `
              -ArgumentList @(
                '/d',
                '/s',
                '/c',
                "call $Command"
              ) `
              -Wait `
              -PassThru `
              -NoNewWindow `
              -ErrorAction Stop

            Write-Host "[EXIT CODE] $($process.ExitCode)"

            return $true
          }
          catch {

            Write-Host "[FAIL] $DisplayName"
            Write-Host "[ERROR] $($_.Exception.Message)"

            return $false
          }
        }


        function Invoke-UninstallCommand {
          param(
            [string]$Command,
            [string]$DisplayName
          )

          if ([string]::IsNullOrWhiteSpace($Command)) {
            return $false
          }

          $Command = $Command.Trim()

          if ($Command -match '(?i)\.(bat|cmd)(?:["\s]|$)') {

            return Invoke-BatchUninstaller `
              -Command $Command `
              -DisplayName $DisplayName
          }

          if ($Command -match '(?i)\.exe(?:["\s]|$)') {

            return Invoke-ExeUninstaller `
              -Command $Command `
              -DisplayName $DisplayName
          }

          if ($Command -match '(?i)msiexec') {

            Write-Host "[MSI] $Command"

            try {

              $parsed = Split-ExecutableCommand -Command $Command

              if ($null -ne $parsed) {

                $arguments = $parsed.Arguments

                $process = Start-Process `
                  -FilePath $parsed.FilePath `
                  -ArgumentList @($arguments) `
                  -Wait `
                  -PassThru `
                  -NoNewWindow `
                  -ErrorAction Stop

                Write-Host "[EXIT CODE] $($process.ExitCode)"

                return $true
              }
            }
            catch {

              Write-Host "[FAIL] MSI uninstall"
              Write-Host "[ERROR] $($_.Exception.Message)"
            }
          }


          # Last resort
          Write-Host "[CMD FALLBACK] $Command"

          try {

            $process = Start-Process `
              -FilePath 'cmd.exe' `
              -ArgumentList @(
                '/d',
                '/s',
                '/c',
                $Command
              ) `
              -Wait `
              -PassThru `
              -NoNewWindow `
              -ErrorAction Stop

            Write-Host "[EXIT CODE] $($process.ExitCode)"

            return $true
          }
          catch {

            Write-Host "[FAIL] $DisplayName"
            Write-Host "[ERROR] $($_.Exception.Message)"

            return $false
          }
        }


        function Get-UniversalUninstallCommand {
          param(
            $App
          )

          if ($App.QuietUninstallString) {
            return $App.QuietUninstallString
          }

          if ($App.UninstallString) {
            return $App.UninstallString
          }

          return $null
        }


        function Test-AppStillInstalled {
          param(
            $App
          )

          try {

            $item = Get-ItemProperty `
              -LiteralPath $App.PSPath `
              -ErrorAction SilentlyContinue

            if ($null -eq $item) {
              return $false
            }

            return $true
          }
          catch {

            return $false
          }
        }


        function Wait-AppRemoval {
          param(
            $App,
            [int]$Seconds = 20
          )

          Write-Host "[CHECK] Waiting for uninstall registration to disappear..."

          for ($i = 0; $i -lt $Seconds; $i++) {

            if (-not (Test-AppStillInstalled -App $App)) {

              Write-Host "[REMOVED] $($App.DisplayName)"

              return $true
            }

            Start-Sleep -Seconds 1
          }

          if (Test-AppStillInstalled -App $App) {

            Write-Host "[WARN] Registry entry still exists:"
            Write-Host "       $($App.DisplayName)"

            return $false
          }

          return $true
        }


        # --------------------------------------------------------
        # REGISTRY CLEANUP
        # --------------------------------------------------------

        foreach ($app in $apps) {

          $name = [string]$app.DisplayName

          if ([string]::IsNullOrWhiteSpace($name)) {
            continue
          }


          # ------------------------------------------------------
          # KEEP ALLOWLIST
          # ------------------------------------------------------

          if (Test-RegistryAllowlist -Name $name) {

            Write-Host "[KEEP] $name"

            continue
          }


          # ------------------------------------------------------
          # REMOVE EVERYTHING ELSE WITH UNINSTALLER
          # ------------------------------------------------------

          $command = Get-UniversalUninstallCommand -App $app

          if ([string]::IsNullOrWhiteSpace($command)) {

            Write-Host ""
            Write-Host "============================================================"
            Write-Host "[SKIP] $name"
            Write-Host "============================================================"
            Write-Host "[WARN] No uninstall command registered."

            continue
          }


          Write-Host ""
          Write-Host "============================================================"
          Write-Host "[REMOVE] $name"
          Write-Host "============================================================"

          if ($app.DisplayVersion) {
            Write-Host "[VERSION] $($app.DisplayVersion)"
          }

          if ($app.QuietUninstallString) {
            Write-Host "[TYPE] QuietUninstallString"
          }
          else {
            Write-Host "[TYPE] UninstallString"
          }

          Write-Host ""
          Write-Host $command
          Write-Host ""

          $success = Invoke-UninstallCommand `
            -Command $command `
            -DisplayName $name

          if (-not $success) {

            Write-Host "[FAIL] $name"

            continue
          }


          # ------------------------------------------------------
          # WAIT FOR REGISTRY ENTRY TO DISAPPEAR
          # ------------------------------------------------------

          $removed = Wait-AppRemoval `
            -App $app `
            -Seconds 20

          if (-not $removed) {

            Write-Host "[WARN] Installer returned, but entry remains."
            Write-Host "[SKIPPED] $name"
          }
        }


    # ============================================================
    # FINAL LEFTOVER DIRECTORIES
    # ============================================================

    - name: Remove known leftover directories
      if: inputs.enable == 'true'
      shell: pwsh
      run: |

        Write-Host ""
        Write-Host "============================================================"
        Write-Host " FINAL LEFTOVER DIRECTORY CLEANUP"
        Write-Host "============================================================"

        # --------------------------------------------------------
        # These are intentionally removed AFTER Chocolatey
        # and registry uninstallers have finished.
        # --------------------------------------------------------

        $paths = @(

          # GitHub hosted runner tool cache
          'C:\hostedtoolcache',

          # Android
          'C:\Program Files (x86)\Android',
          'C:\Program Files\Android',
          'C:\Android',

          # GHCup / Haskell
          'C:\ghcup',

          # Julia
          'C:\Julia',

          # PostgreSQL leftovers
          'C:\PostgreSQL',

          # MinGW
          'C:\mingw32',
          'C:\mingw64',

          # Selenium
          'C:\selenium',
          'C:\seleniumWebDrivers',

          # Strawberry Perl
          'C:\Strawberry',

          # MSYS2
          'C:\msys64',

          # Android user data
          "$env:LOCALAPPDATA\Android",
          "$env:USERPROFILE\.android",

          # Gradle
          "$env:USERPROFILE\.gradle",

          # Maven
          "$env:USERPROFILE\.m2",

          # NuGet
          "$env:USERPROFILE\.nuget",

          # Conda / Anaconda
          "$env:USERPROFILE\anaconda3",
          "$env:USERPROFILE\miniconda3"
        )


        $paths = $paths | Select-Object -Unique


        foreach ($path in $paths) {

          if (-not (Test-Path -LiteralPath $path)) {

            Write-Host "[SKIP] $path"

            continue
          }


          Write-Host ""
          Write-Host "[REMOVE] $path"

          try {

            Remove-Item `
              -LiteralPath $path `
              -Recurse `
              -Force `
              -ErrorAction Stop

            Write-Host "[REMOVED] $path"
          }
          catch {

            Write-Host "[WARN] Could not remove:"
            Write-Host "       $path"
            Write-Host "       $($_.Exception.Message)"
          }
        }


    # ============================================================
    # FINAL CHOCOLATEY VERIFICATION
    # ============================================================

    - name: Verify Chocolatey packages
      if: inputs.enable == 'true'
      shell: pwsh
      run: |

        Write-Host ""
        Write-Host "============================================================"
        Write-Host " FINAL CHOCOLATEY PACKAGE LIST"
        Write-Host "============================================================"

        $choco = Get-Command choco.exe -ErrorAction SilentlyContinue

        if ($null -eq $choco) {

          Write-Host "[INFO] Chocolatey not available."

          exit 0
        }


        $lines = @(
          & choco.exe list --local-only --limit-output 2>$null
        )


        $count = 0

        foreach ($line in $lines) {

          if ([string]::IsNullOrWhiteSpace($line)) {
            continue
          }

          if ($line -match '^([^|]+)\|(.+)$') {

            $id = $Matches[1]
            $version = $Matches[2]

            Write-Host "[PACKAGE] $id $version"

            $count++
          }
        }


        Write-Host ""
        Write-Host "[TOTAL CHOCO PACKAGES] $count"


    # ============================================================
    # FINAL DIRECTORY CHECK
    # ============================================================

    - name: Verify removed directories
      if: inputs.enable == 'true'
      shell: pwsh
      run: |

        Write-Host ""
        Write-Host "============================================================"
        Write-Host " FINAL DIRECTORY CHECK"
        Write-Host "============================================================"

        $paths = @(
          'C:\hostedtoolcache',
          'C:\Program Files (x86)\Android',
          'C:\Program Files\Android',
          'C:\Android',
          'C:\ghcup',
          'C:\Julia',
          'C:\PostgreSQL',
          'C:\mingw32',
          'C:\mingw64',
          'C:\selenium',
          'C:\seleniumWebDrivers',
          'C:\Strawberry',
          'C:\msys64'
        )


        foreach ($path in $paths) {

          if (Test-Path -LiteralPath $path) {

            Write-Host "[LEFTOVER] $path"
          }
          else {

            Write-Host "[CLEAN]    $path"
          }
        }


    # ============================================================
