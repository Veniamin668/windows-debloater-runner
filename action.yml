name: Windows Debloat & Cleanup
description: Aggressive Windows runner cleanup with selected development tools preserved
author: Windows Debloat & Cleanup

branding:
  icon: trash-2
  color: red
  
inputs:
  enable:
    description: Enable cleanup
    required: false
    default: 'true'

  remove_services:
    description: Stop and remove unwanted services
    required: false
    default: 'true'
  
  azure-del:
   description: Remove folder C:\Modules azure modules
   required: false
   default: 'true'
  
  choco-del:
   description: chocolatey remove
   required: false
   default: 'true'

runs:
  using: composite
  steps:

    # ============================================================
    # STOP KNOWN UNWANTED SERVICES
    # ============================================================

    - name: Stop unwanted services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'PostgreSQL',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {
          $service = Get-Service -Name $name -ErrorAction SilentlyContinue

          if ($null -ne $service) {
            Write-Host "[STOP] $name"

            try {
              Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
            }
            catch {
              Write-Warning "Failed to stop service: $name"
            }
          }
        }


    # ============================================================
    # STOP UNWANTED PROCESSES
    # ============================================================

    - name: Stop unwanted processes
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $processes = @(
          'postgres',
          'postgresql',
          'mongod',
          'mongo',
          'httpd',
          'nginx',
          'mysqld',
          'mysql',
          'w3wp',
          'java',
          'javaw',
          'python',
          'python3',
          'conda',
          'ruby',
          'perl',
          'dotnet'
        )

        foreach ($name in $processes) {
          Get-Process -Name $name -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
        }


    # ============================================================
    # REMOVE HOSTED TOOL CACHE
    # ============================================================

    - name: Remove hosted tool cache
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $path = 'C:\hostedtoolcache'

        if (Test-Path -LiteralPath $path) {
          Write-Host "[REMOVE] $path"

          try {
            Remove-Item `
              -LiteralPath $path `
              -Recurse `
              -Force `
              -ErrorAction Stop

            Write-Host "[REMOVED] $path"
          }
          catch {
            Write-Warning "Failed to completely remove $path"
            Write-Warning $_
          }
        }
        else {
          Write-Host "[NOT FOUND] $path"
        }


    # ============================================================
    # REMOVE ANDROID FROM PROGRAM FILES (X86)
    # ============================================================

    - name: Remove Android directory
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $base = 'C:\Program Files (x86)'

        if (-not (Test-Path -LiteralPath $base)) {
          Write-Host "[NOT FOUND] $base"
          exit 0
        }

        $androidDirs = Get-ChildItem `
          -LiteralPath $base `
          -Directory `
          -Force `
          -ErrorAction SilentlyContinue |
          Where-Object {
            $_.Name -match '(?i)^Android$'
          }

        foreach ($dir in $androidDirs) {
          Write-Host "[REMOVE] $($dir.FullName)"

          try {
            Remove-Item `
              -LiteralPath $dir.FullName `
              -Recurse `
              -Force `
              -ErrorAction Stop

            Write-Host "[REMOVED] $($dir.FullName)"
          }
          catch {
            Write-Warning "Failed to remove $($dir.FullName)"
            Write-Warning $_
          }
        }

    # ============================================================
    # REMOVE actionarchivecache
    # ============================================================

    - name: Remove action archive cache
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $path = 'C:\actionarchivecache'

        if (Test-Path -LiteralPath $path) {
          Write-Host "[REMOVE] $path"

          try {
            Remove-Item `
              -LiteralPath $path `
              -Recurse `
              -Force `
              -ErrorAction Stop

            Write-Host "[REMOVED] $path"
          }
          catch {
            Write-Warning "Failed to completely remove $path"
            Write-Warning $_
