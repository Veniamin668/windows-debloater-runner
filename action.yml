        }
        
    - name: Remove Chocolatey packages
      if: ${{ inputs.choco-del == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        if (-not (Get-Command choco.exe -ErrorAction SilentlyContinue)) {
        Write-Host "[CHOCO] Chocolatey is not installed - skipping"
        exit 0
        }

          # ========================================================
        # CHOCOLATEY ALLOWLIST
          # Everything else installed through Chocolatey is removed.
          # ========================================================

        $chocoAllowPatterns = @(
        # Firefox
        '(?i)^firefox($|-)'

        # Mozilla Maintenance Service
        '(?i)^mozilla-maintenance-service($|-)'

        # 7-Zip
        '(?i)^7zip($|-)'

        # Visual Studio
        '(?i)^visualstudio($|[-.])'
        '(?i)^visual-studio($|[-.])'
        '(?i)^vswhere($|-)'

        # Git
        '(?i)^git($|-)'
        '(?i)^git-for-windows($|-)'
        '(?i)^git-credential-manager($|-)'
        '(?i)^gcm($|-)'

        # GitHub CLI
        '(?i)^gh($|-)'
        '(?i)^github-cli($|-)'

        # Tailscale
        '(?i)^tailscale($|-)'

        # Docker
        '(?i)^docker($|-)'
        '(?i)^docker-desktop($|-)'

        # WSL
        '(?i)^wsl($|-)'
        '(?i)^wsl2($|-)'

        # Kubernetes
        '(?i)^kubernetes($|-)'
        '(?i)^kubectl($|-)'
        '(?i)^minikube($|-)'
        '(?i)^kind($|-)'

        # Node.js
        '(?i)^nodejs($|-)'
        '(?i)^nodejs-lts($|-)'
        '(?i)^npm($|-)'
        '(?i)^npx($|-)'

        # PowerShell
         '(?i)^powershell($|-)'
        '(?i)^powershell-core($|-)'
        '(?i)^pwsh($|-)'
        )
        
        # ========================================================
        # DISCOVER INSTALLED CHOCOLATEY PACKAGES
         # ========================================================

        $packages = @(
        choco list --local-only --limit-output 2>$null |
        Where-Object {
          $_ -match '^[^|]+\|[^|]+$'
        } |
        ForEach-Object {
          $parts = $_ -split '\|', 2

          [PSCustomObject]@{
            Id      = $parts[0].Trim()
            Version = $parts[1].Trim()
          }
        }
        )

        Write-Host "[CHOCO] Found $($packages.Count) installed packages"

        # ========================================================
        # REMOVE EVERYTHING NOT IN CHOCOLATEY ALLOWLIST
        # ========================================================

        foreach ($package in $packages) {

        $keep = $false

        foreach ($pattern in $chocoAllowPatterns) {
        if ($package.Id -match $pattern) {
          $keep = $true
          break
        }
        }

        if ($keep) {
        Write-Host "[CHOCO KEEP] $($package.Id) $($package.Version)"
        continue
        }

        Write-Host "[CHOCO REMOVE] $($package.Id) $($package.Version)"

        try {
        choco uninstall $package.Id `
          -y `
          --force `
          --no-progress

        # Chocolatey can report a warning/negative exit code even
        # when the package itself has already disappeared.
        $remaining = @(
          choco list --local-only --limit-output 2>$null |
            Where-Object {
              $_ -match (
                '^(?i)' +
                [regex]::Escape($package.Id) +
                '\|'
              )
            }
        )

        if ($remaining.Count -eq 0) {
          Write-Host "[CHOCO REMOVED] $($package.Id)"
        }
        else {
          Write-Warning "[CHOCO FAILED] $($package.Id) is still installed"
        }
        }
        catch {
        Write-Warning "[CHOCO ERROR] $($package.Id)"
        Write-Warning $_
        }
        }

        Write-Host "[CHOCO] Cleanup complete"
  
    # ============================================================
    # DISCOVER INSTALLED SOFTWARE
    # ============================================================

    - name: Discover installed software
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          try {
            $apps += Get-ItemProperty `
              -Path $path `
              -ErrorAction SilentlyContinue
          }
          catch {
          }
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName, PSPath -Unique

        Write-Host ""
        Write-Host "============================================================"
        Write-Host "INSTALLED SOFTWARE"
        Write-Host "============================================================"

        foreach ($app in $apps) {
          Write-Host $app.DisplayName
        }

        Write-Host ""
        Write-Host "Total: $($apps.Count)"


    # ============================================================
    # ALLOWLIST CLEANUP
    #
    # KEEP:
    #   Firefox
    #   Visual Studio
    #   Git
    #   7-Zip
    #   GitHub CLI
    #   Tailscale
    #   Docker
    #   WSL
    #   Kubernetes
    #   Node.js / npm / npx
    #   PowerShell 7
    #
    # REMOVE:
    #   Everything else with a registered uninstaller
    # ============================================================

    - name: Remove everything except allowlist
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        # ========================================================
        # ALLOWLIST
        # ========================================================

        $allowPatterns = @(

          # ------------------------------------------------------
          # FIREFOX
          # ------------------------------------------------------

          '(?i)\bMozilla Firefox\b',
          '(?i)^Firefox\b',

          # ------------------------------------------------------
          # 7-ZIP
          # ------------------------------------------------------

          '(?i)^7-Zip\b',
          '(?i)^7-Zip [0-9]',
          '(?i)^7-Zip Extra\b',
          
          # ------------------------------------------------------
          # VISUAL STUDIO
          # ------------------------------------------------------

          '(?i)\bMicrosoft Visual Studio\b',
          '(?i)^Visual Studio\b',
          '(?i)^Visual Studio Build Tools\b',
          '(?i)^Visual Studio Installer\b',
          '(?i)^VS Installer\b',
          '(?i)^vs_',
          '(?i)^sptools_Microsoft\.VisualStudio',
          '(?i)^Microsoft Visual Studio Setup',

          # ------------------------------------------------------
          # GIT
          # ------------------------------------------------------

          '(?i)^Git$',
          '(?i)^Git for Windows\b',
          '(?i)^Git Credential Manager',

          # ------------------------------------------------------
          # GITHUB CLI
          # ------------------------------------------------------

          '(?i)^GitHub CLI$',
          '(?i)^GitHub Command Line Interface\b',

          # ------------------------------------------------------
          # TAILSCALE
          # ------------------------------------------------------

          '(?i)^Tailscale\b',
          '(?i)^Tailscale VPN\b',

          # ------------------------------------------------------
          # DOCKER
          # ------------------------------------------------------

          '(?i)^Docker\b',
          '(?i)^Docker Desktop\b',
          '(?i)^Docker Engine\b',
          '(?i)^Docker Compose\b',
          '(?i)^Docker CLI\b',
          '(?i)^Docker CE\b',
          '(?i)^Docker Inc\.',
          '(?i)^Docker Desktop Installer\b',

          # ------------------------------------------------------
          # WSL
          # ------------------------------------------------------

          '(?i)^Windows Subsystem for Linux\b',
          '(?i)^WSL\b',
          '(?i)^Windows Subsystem for Linux Update\b',

          # Linux distributions commonly registered as apps
          '(?i)^Ubuntu\b',
          '(?i)^Debian\b',
          '(?i)^Kali Linux\b',
          '(?i)^Oracle Linux\b',
          '(?i)^SUSE Linux\b',
          '(?i)^openSUSE\b',

          # ------------------------------------------------------
          # KUBERNETES
          # ------------------------------------------------------

          '(?i)^Kubernetes\b',
          '(?i)^Kubernetes CLI\b',
          '(?i)^kubectl\b',
          '(?i)^Minikube\b',
          '(?i)^kind\b',

          # ------------------------------------------------------
          # NODE.JS
          # ------------------------------------------------------

          '(?i)^Node\.js\b',
          '(?i)^NodeJS\b',
          '(?i)^Node\.js Runtime\b',
          '(?i)^npm\b',
          '(?i)^npx\b',

          # ------------------------------------------------------
          # POWERSHELL 7
          # ------------------------------------------------------

          '(?i)^PowerShell 7\b',
          '(?i)^PowerShell 7-preview\b',
          '(?i)^PowerShell Core\b',
          '(?i)^PowerShell\b'
        )


        function Test-Allowlist {
          param(
            [string]$Name
          )

          foreach ($pattern in $allowPatterns) {
            if ($Name -match $pattern) {
              return $true
            }
          }

          return $false
        }


        # ========================================================
        # GET INSTALLED SOFTWARE
        # ========================================================

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          try {
            $apps += Get-ItemProperty `
              -Path $path `
              -ErrorAction SilentlyContinue
          }
          catch {
          }
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName, PSPath -Unique


        $removed = 0
        $kept = 0
        $failed = 0
        $skipped = 0


        # ========================================================
        # PROCESS EACH APPLICATION
        # ========================================================

        foreach ($app in $apps) {

          $name = $app.DisplayName

          # ------------------------------------------------------
          # KEEP ALLOWLIST
          # ------------------------------------------------------

          if (Test-Allowlist -Name $name) {
            Write-Host "[KEEP] $name"
            $kept++
            continue
          }


          # ------------------------------------------------------
          # FIND UNINSTALL COMMAND
          # ------------------------------------------------------

          $uninstall = $app.QuietUninstallString

          if ([string]::IsNullOrWhiteSpace($uninstall)) {
            $uninstall = $app.UninstallString
          }


          if ([string]::IsNullOrWhiteSpace($uninstall)) {
            Write-Host "[NO UNINSTALLER] $name"
            $skipped++
            continue
          }


          Write-Host ""
          Write-Host "============================================================"
          Write-Host "[REMOVE] $name"
          Write-Host "============================================================"


          try {

            # ====================================================
            # MSI
            # ====================================================

            if ($uninstall -match '(?i)msiexec(?:\.exe)?') {

              $command = $uninstall

              $command = $command -replace `
                '(?i)\s+/I(?=\s|{)', `
                ' /X'

              $command = $command -replace `
                '(?i)\s+/i(?=\s|{)', `
                ' /X'

              if ($command -notmatch '(?i)\s/(quiet|qn)\b') {
                $command += ' /quiet /norestart'
              }

              Write-Host "MSI command:"
              Write-Host $command

              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $command" `
                -Wait `
                -PassThru `
                -NoNewWindow

              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 1605 -or
                $process.ExitCode -eq 1614 -or
                $process.ExitCode -eq 3010
              ) {
                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {
                Write-Warning `
                  "[FAILED] $name - MSI exit code $($process.ExitCode)"

                $failed++
              }

              continue
            }


            # ====================================================
            # INNO SETUP
            # ====================================================

            if ($uninstall -match '(?i)unins\d*\.exe') {

              $command = $uninstall

              if ($command -notmatch '(?i)/VERYSILENT') {
                $command += `
                  ' /VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
              }

              Write-Host "Inno Setup command:"
              Write-Host $command

              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $command" `
                -Wait `
                -PassThru `
                -NoNewWindow

              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 3010
              ) {
                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {
                Write-Warning `
                  "[FAILED] $name - exit code $($process.ExitCode)"

                $failed++
              }

              continue
            }


            # ====================================================
            # NSIS
            # ====================================================

            if ($uninstall -match '(?i)uninstall\.exe') {

              $command = $uninstall

              if ($command -notmatch '(?i)\s/S\b') {
                $command += ' /S'
              }

              Write-Host "NSIS command:"
              Write-Host $command

              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $command" `
                -Wait `
                -PassThru `
                -NoNewWindow

              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 3010
              ) {
                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {
                Write-Warning `
                  "[FAILED] $name - exit code $($process.ExitCode)"

                $failed++
              }

              continue
            }


            # ====================================================
            # UNKNOWN EXE
            # ====================================================

            if ($uninstall -match '(?i)\.exe') {

              Write-Warning `
                "[SKIP] Unknown EXE uninstaller: $name"

              Write-Warning `
                "Command: $uninstall"

              $skipped++
              continue
            }


            # ====================================================
            # UNKNOWN
            # ====================================================

            Write-Warning `
              "[SKIP] Unsupported uninstaller: $name"

            $skipped++

          }
          catch {

            Write-Warning "[ERROR] $name"
            Write-Warning $_

            $failed++
          }
        }


        # ========================================================
        # SUMMARY
        # ========================================================

        Write-Host ""
        Write-Host ""
        Write-Host "============================================================"
        Write-Host "DEBLOAT SUMMARY"
        Write-Host "============================================================"
        Write-Host "Removed : $removed"
        Write-Host "Kept    : $kept"
        Write-Host "Skipped : $skipped"
        Write-Host "Failed  : $failed"
        Write-Host "============================================================"


    # ============================================================
    # REMOVE LEFTOVER UNWANTED SERVICES
    # ============================================================

    - name: Remove leftover unwanted services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'PostgreSQL',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {

          $service = Get-Service `
            -Name $name `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            continue
          }

          Write-Host "[DELETE SERVICE] $name"

          try {
            & sc.exe delete $name
          }
          catch {
            Write-Warning "Could not delete service: $name"
          }
        }


    # ============================================================
    # FINAL VERIFICATION
    # ============================================================

    - name: Verify preserved software
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          $apps += Get-ItemProperty `
            -Path $path `
            -ErrorAction SilentlyContinue
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName -Unique


        Write-Host ""
        Write-Host "============================================================"
        Write-Host "PRESERVED SOFTWARE"
        Write-Host "============================================================"


        Write-Host ""
        Write-Host "[Firefox]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)Firefox'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Visual Studio]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)(Visual Studio|^vs_|sptools_Microsoft\.VisualStudio)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Git]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^Git($| for Windows| Credential Manager)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[GitHub CLI]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^GitHub CLI$'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Tailscale]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)Tailscale'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Docker]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^Docker'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[WSL / Kubernetes]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)(Windows Subsystem for Linux|^WSL|Ubuntu|Debian|Kali Linux|Kubernetes|kubectl|Minikube|kind)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Node.js]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)(^Node\.js|^NodeJS|^npm|^npx)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[PowerShell]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^PowerShell'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "============================================================"
        Write-Host "WINDOWS DEBLOAT COMPLETED"
        Write-Host "============================================================"
