    - name: Remove Chocolatey packages
      if: ${{ inputs.choco-del == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        if (-not (Get-Command choco.exe -ErrorAction SilentlyContinue)) {
        Write-Host "[CHOCO] Chocolatey is not installed - skipping"
        exit 0
        }

          # ========================================================
        # CHOCOLATEY ALLOWLIST
          # Everything else installed through Chocolatey is removed.
          # ========================================================

        $chocoAllowPatterns = @(

        # 7-Zip
        '(?i)^7zip($|-)'
        # Zen browser
        '(?i)^Zen($|-)'
        '(?i)^Zen Browser($|-)'

        # Visual Studio
        '(?i)^visualstudio($|[-.])'
        '(?i)^visual-studio($|[-.])'
        '(?i)^vswhere($|-)'

        # Git
        '(?i)^git($|-)'
        '(?i)^git-for-windows($|-)'
        '(?i)^git-credential-manager($|-)'
        '(?i)^gcm($|-)'

        # GitHub CLI
        '(?i)^gh($|-)'
        '(?i)^github-cli($|-)'

        # Tailscale
        '(?i)^tailscale($|-)'

        # Docker
        '(?i)^docker($|-)'
        '(?i)^docker-desktop($|-)'

        # WSL
        '(?i)^wsl($|-)'
        '(?i)^wsl2($|-)'

        # Kubernetes
        '(?i)^kubernetes($|-)'
        '(?i)^kubectl($|-)'
        '(?i)^minikube($|-)'
        '(?i)^kind($|-)'

        # Node.js
        '(?i)^nodejs($|-)'
        '(?i)^nodejs-lts($|-)'
        '(?i)^npm($|-)'
        '(?i)^npx($|-)'

        # UEFI
        '(?i)^Enable UEFI SecureBoot Tool($|-)'
        '(?i)^SecureBoot($|-)'
        '(?i)^UEFI($|-)'
        '(?i)^TPM($|-)'
          
        # aria2
        '(?i)^aria2($|-)'

        # cmake
        #'(?i)^cmake.install($|-)'
        
        # PowerShell
         '(?i)^powershell($|-)'
        '(?i)^powershell-core($|-)'
        '(?i)^pwsh($|-)'
        )
        
        # ========================================================
        # DISCOVER INSTALLED CHOCOLATEY PACKAGES
         # ========================================================

        $packages = @(
        choco list --local-only --limit-output 2>$null |
        Where-Object {
          $_ -match '^[^|]+\|[^|]+$'
        } |
        ForEach-Object {
          $parts = $_ -split '\|', 2

          [PSCustomObject]@{
            Id      = $parts[0].Trim()
            Version = $parts[1].Trim()
          }
        }
        )

        Write-Host "[CHOCO] Found $($packages.Count) installed packages"

        # ========================================================
        # REMOVE EVERYTHING NOT IN CHOCOLATEY ALLOWLIST
        # ========================================================

        foreach ($package in $packages) {

        $keep = $false

        foreach ($pattern in $chocoAllowPatterns) {
        if ($package.Id -match $pattern) {
          $keep = $true
          break
        }
        }

        if ($keep) {
        Write-Host "[CHOCO KEEP] $($package.Id) $($package.Version)"
        continue
        }

        Write-Host "[CHOCO REMOVE] $($package.Id) $($package.Version)"

        try {
        choco uninstall $package.Id `
          -y `
          --force `
          --no-progress

        # Chocolatey can report a warning/negative exit code even
        # when the package itself has already disappeared.
        $remaining = @(
          choco list --local-only --limit-output 2>$null |
            Where-Object {
              $_ -match (
                '^(?i)' +
                [regex]::Escape($package.Id) +
                '\|'
              )
            }
        )

        if ($remaining.Count -eq 0) {
          Write-Host "[CHOCO REMOVED] $($package.Id)"
        }
        else {
          Write-Warning "[CHOCO FAILED] $($package.Id) is still installed"
        }
        }
        catch {
        Write-Warning "[CHOCO ERROR] $($package.Id)"
        Write-Warning $_
        }
        }

        Write-Host "[CHOCO] Cleanup complete"
  
    # ============================================================
    # DISCOVER INSTALLED SOFTWARE
    # ============================================================

    - name: Discover installed software
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          try {
            $apps += Get-ItemProperty `
              -Path $path `
              -ErrorAction SilentlyContinue
          }
          catch {
          }
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName, PSPath -Unique

        Write-Host ""
        Write-Host "============================================================"
        Write-Host "INSTALLED SOFTWARE"
        Write-Host "============================================================"

        foreach ($app in $apps) {
          Write-Host $app.DisplayName
        }

        Write-Host ""
        Write-Host "Total: $($apps.Count)"


    # ============================================================
    # ALLOWLIST CLEANUP
    #
    # KEEP:
    #   Visual Studio
    #   Git
    #   7-Zip
    #   GitHub CLI
    #   Tailscale
    #   Docker
    #   WSL
    #   Kubernetes
    #   Node.js / npm / npx
    #   PowerShell 7
    #
    # REMOVE:
    #   Everything else with a registered uninstaller
    # ============================================================

    - name: Remove everything except allowlist
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        # ========================================================
        # ALLOWLIST
        # ========================================================

        $allowPatterns = @(

          # ------------------------------------------------------
          # Enable UEFI SecureBoot Tool
          # ------------------------------------------------------
          '(?i)^Enable UEFI SecureBoot Tool($|-)'
          '(?i)^SecureBoot($|-)'
          '(?i)^UEFI($|-)'
          '(?i)^TPM($|-)'
          
          # ------------------------------------------------------
          # 7-ZIP
          # ------------------------------------------------------
          '(?i)^7-Zip\b',
          '(?i)^7-Zip [0-9]',
          '(?i)^7-Zip Extra\b',

          # ------------------------------------------------------
          # Zen Browser
          # ------------------------------------------------------
          '(?i)^Zen\b',
          '(?i)^Zen Browser',
          # ------------------------------------------------------
          # VISUAL STUDIO
          # ------------------------------------------------------

          '(?i)\bMicrosoft Visual Studio\b',
          '(?i)^Visual Studio\b',
          '(?i)^Visual Studio Build Tools\b',
          '(?i)^Visual Studio Installer\b',
          '(?i)^VS Installer\b',
          '(?i)^vs_',
          '(?i)^sptools_Microsoft\.VisualStudio',
          '(?i)^Microsoft Visual Studio Setup',

          # ------------------------------------------------------
          # GIT
          # ------------------------------------------------------

          '(?i)^Git$',
          '(?i)^Git for Windows\b',
          '(?i)^Git Credential Manager',

          # ------------------------------------------------------
          # GITHUB CLI
          # ------------------------------------------------------

          '(?i)^GitHub CLI$',
          '(?i)^GitHub Command Line Interface\b',

          # ------------------------------------------------------
          # TAILSCALE
          # ------------------------------------------------------

          '(?i)^Tailscale\b',
          '(?i)^Tailscale VPN\b',

          # ------------------------------------------------------
          # DOCKER
          # ------------------------------------------------------

          '(?i)^Docker\b',
          '(?i)^Docker Desktop\b',
          '(?i)^Docker Engine\b',
          '(?i)^Docker Compose\b',
          '(?i)^Docker CLI\b',
          '(?i)^Docker CE\b',
          '(?i)^Docker Inc\.',
          '(?i)^Docker Desktop Installer\b',

          # ------------------------------------------------------
          # WSL
          # ------------------------------------------------------

          '(?i)^Windows Subsystem for Linux\b',
          '(?i)^WSL\b',
          '(?i)^Windows Subsystem for Linux Update\b',

          # Linux distributions commonly registered as apps
          '(?i)^Ubuntu\b',
          '(?i)^Debian\b',
          '(?i)^Kali Linux\b',
          '(?i)^Oracle Linux\b',
          '(?i)^SUSE Linux\b',
          '(?i)^openSUSE\b',

          # ------------------------------------------------------
          # KUBERNETES
          # ------------------------------------------------------

          '(?i)^Kubernetes\b',
          '(?i)^Kubernetes CLI\b',
          '(?i)^kubectl\b',
          '(?i)^Minikube\b',
          '(?i)^kind\b',

          # ------------------------------------------------------
          # NODE.JS
          # ------------------------------------------------------

          '(?i)^Node\.js\b',
          '(?i)^NodeJS\b',
          '(?i)^Node\.js Runtime\b',
          '(?i)^npm\b',
          '(?i)^npx\b',

          # ------------------------------------------------------
          # POWERSHELL 7
          # ------------------------------------------------------

          '(?i)^PowerShell 7\b',
          '(?i)^PowerShell 7-preview\b',
          '(?i)^PowerShell Core\b',
          '(?i)^PowerShell\b'
        )


        function Test-Allowlist {
          param(
            [string]$Name
          )

          foreach ($pattern in $allowPatterns) {
            if ($Name -match $pattern) {
              return $true
            }
          }

          return $false
        }


        # ========================================================
        # GET INSTALLED SOFTWARE
        # ========================================================

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          try {
            $apps += Get-ItemProperty `
              -Path $path `
              -ErrorAction SilentlyContinue
          }
          catch {
          }
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName, PSPath -Unique


        $removed = 0
        $kept = 0
        $failed = 0
        $skipped = 0


        # ========================================================
        # PROCESS EACH APPLICATION
        # ========================================================

        foreach ($app in $apps) {

          $name = $app.DisplayName

          # ------------------------------------------------------
          # KEEP ALLOWLIST
          # ------------------------------------------------------

          if (Test-Allowlist -Name $name) {
            Write-Host "[KEEP] $name"
            $kept++
            continue
          }


          # ------------------------------------------------------
          # FIND UNINSTALL COMMAND
          # ------------------------------------------------------

          $uninstall = $app.QuietUninstallString

          if ([string]::IsNullOrWhiteSpace($uninstall)) {
            $uninstall = $app.UninstallString
          }


          if ([string]::IsNullOrWhiteSpace($uninstall)) {
            Write-Host "[NO UNINSTALLER] $name"
            $skipped++
            continue
          }


          Write-Host ""
          Write-Host "============================================================"
          Write-Host "[REMOVE] $name"
          Write-Host "============================================================"


          try {

            # ====================================================
            # MSI
            # ====================================================

            if ($uninstall -match '(?i)msiexec(?:\.exe)?') {

              $command = $uninstall

              $command = $command -replace `
                '(?i)\s+/I(?=\s|{)', `
                ' /X'

              $command = $command -replace `
                '(?i)\s+/i(?=\s|{)', `
                ' /X'

              if ($command -notmatch '(?i)\s/(quiet|qn)\b') {
                $command += ' /quiet /norestart'
              }

              Write-Host "MSI command:"
              Write-Host $command

              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $command" `
                -Wait `
                -PassThru `
                -NoNewWindow

              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 1605 -or
                $process.ExitCode -eq 1614 -or
                $process.ExitCode -eq 3010
              ) {
                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {
                Write-Warning `
                  "[FAILED] $name - MSI exit code $($process.ExitCode)"

                $failed++
              }

              continue
            }


            # ====================================================
            # INNO SETUP
            # ====================================================

            if ($uninstall -match '(?i)unins\d*\.exe') {

              $command = $uninstall

              if ($command -notmatch '(?i)/VERYSILENT') {
                $command += `
                  ' /VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
              }

              Write-Host "Inno Setup command:"
              Write-Host $command

              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $command" `
                -Wait `
                -PassThru `
                -NoNewWindow

              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 3010
              ) {
                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {
                Write-Warning `
                  "[FAILED] $name - exit code $($process.ExitCode)"

                $failed++
              }

              continue
            }


            # ====================================================
            # NSIS
            # ====================================================

            if ($uninstall -match '(?i)uninstall\.exe') {

              $command = $uninstall

              if ($command -notmatch '(?i)\s/S\b') {
                $command += ' /S'
              }

              Write-Host "NSIS command:"
              Write-Host $command

              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $command" `
                -Wait `
                -PassThru `
                -NoNewWindow

              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 3010
              ) {
                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {
                Write-Warning `
                  "[FAILED] $name - exit code $($process.ExitCode)"

                $failed++
              }

              continue
            }


            # ====================================================
            # UNKNOWN EXE
            # ====================================================

            if ($uninstall -match '(?i)\.exe') {

              Write-Warning `
                "[SKIP] Unknown EXE uninstaller: $name"

              Write-Warning `
                "Command: $uninstall"

              $skipped++
              continue
            }


            # ====================================================
            # UNKNOWN
            # ====================================================

            Write-Warning `
              "[SKIP] Unsupported uninstaller: $name"

            $skipped++

          }
          catch {

            Write-Warning "[ERROR] $name"
            Write-Warning $_

            $failed++
          }
        }


        # ========================================================
        # SUMMARY
        # ========================================================

        Write-Host ""
        Write-Host ""
        Write-Host "============================================================"
        Write-Host "DEBLOAT SUMMARY"
        Write-Host "============================================================"
        Write-Host "Removed : $removed"
        Write-Host "Kept    : $kept"
        Write-Host "Skipped : $skipped"
        Write-Host "Failed  : $failed"
        Write-Host "============================================================"



    # ============================================================
    # REMOVE LEFTOVER UNWANTED SERVICES
    # ============================================================

    - name: Remove leftover unwanted services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'PostgreSQL',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {

          $service = Get-Service `
            -Name $name `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            continue
          }

          Write-Host "[DELETE SERVICE] $name"

          try {
            & sc.exe delete $name
          }
          catch {
            Write-Warning "Could not delete service: $name"
          }
        }

    - name: Clean environment variables and PATH
      if: inputs.path-clean == 'true'
      shell: pwsh
      run: |
        Write-Host "========== Начинаем смачную чистку переменных среды и PATH (pwsh 7) ==========" -ForegroundColor Cyan

        # 1. Белый список системных переменных (База ОС, WSL, Docker)
        $AllowedSystemVars = [System.Collections.Generic.HashSet[string]]::new([string[]]@(
            "ComSpec", "OS", "PATHEXT", "SystemDrive", "SystemRoot", "windir",
            "ALLUSERSPROFILE", "PUBLIC", "LOCALAPPDATA", "APPDATA", "COMPUTERNAME", 
            "USERPROFILE", "USERNAME", "NUMBER_OF_PROCESSORS", "PROCESSOR_ARCHITECTURE", 
            "PROCESSOR_IDENTIFIER", "PROCESSOR_LEVEL", "PROCESSOR_REVISION",
            "ProgramData", "ProgramFiles", "ProgramFiles(x86)", "ProgramW6432", 
            "CommonProgramFiles", "CommonProgramFiles(x86)",
            "DOCKER_HOST", "DOCKER_TLS_VERIFY", "DOCKER_CERT_PATH",
            "WSLENV", "WSL_DISTRO_NAME"
        ), [System.StringComparer]::OrdinalIgnoreCase)

        # 2. Выносим лишние переменные окружения через быстрый .NET API
        Write-Host "[*] Анализируем системные переменные..." -ForegroundColor Cyan
        Get-ChildItem Env: | Where-Object { 
            -not $AllowedSystemVars.Contains($_.Name) -and 
            $_.Name -notlike "Path" -and 
            $_.Name -notlike "TEMP" -and 
            $_.Name -notlike "TMP" 
        } | ForEach-Object {
            Write-Host "[-] Сносим мусорную переменную: $($_.Name)" -ForegroundColor Yellow

            # Удаляем переменную из системного реестра
            $MachineKey = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey(
                "SYSTEM\CurrentControlSet\Control\Session Manager\Environment",
                $true
            )

            # Удаляем переменную из пользовательского реестра
            $UserKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
                "Environment",
                $true
            )

            try {
                if ($null -ne $MachineKey) {
                    $MachineKey.DeleteValue($_.Name, $false)
                }

                if ($null -ne $UserKey) {
                    $UserKey.DeleteValue($_.Name, $false)
                }
            }
            finally {
                if ($null -ne $MachineKey) {
                    $MachineKey.Dispose()
                }

                if ($null -ne $UserKey) {
                    $UserKey.Dispose()
                }
            }

            # Удаляем переменную из текущего процесса
            Remove-Item -Path "Env:\$($_.Name)" -Force -ErrorAction SilentlyContinue
        }

        # Функция для быстрой фильтрации путей от мертвых ссылок
        function Filter-DeadPaths ([string]$TargetContext) {
            $RawPath = [Environment]::GetEnvironmentVariable("Path", $TargetContext)
            if (-not [string]::IsNullOrEmpty($RawPath)) {
                $Elements = $RawPath -split ';' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
                $Cleaned = [System.Collections.Generic.List[string]]::new()

                foreach ($Dir in $Elements) {
                    $NormalizedDir = $Dir.Trim().Trim('"')

                    # pwsh делает Test-Path мгновенным на быстром NVMe раннера
                    if (Test-Path -LiteralPath $NormalizedDir -ErrorAction SilentlyContinue) {
                        $Cleaned.Add($Dir)
                    } else {
                        Write-Host "[-] [$TargetContext PATH] Вырезана мертвая ссылка: $Dir" -ForegroundColor Red
                    }
                }
                
                $NewPath = $Cleaned -join ';'
                [Environment]::SetEnvironmentVariable("Path", $NewPath, $TargetContext)
                [Environment]::SetEnvironmentVariable("Path", $NewPath, [EnvironmentVariableTarget]::Process)
            }
        }

        # 3. Чистим Системный и Пользовательский PATH
        Write-Host "[*] Проверяем системный PATH..." -ForegroundColor Cyan
        Filter-DeadPaths -TargetContext "Machine"

        Write-Host "[*] Проверяем пользовательский PATH..." -ForegroundColor Cyan
        Filter-DeadPaths -TargetContext "User"

        Write-Host "[+] Переменные среды и PATH девственно чисты!" -ForegroundColor Green
        
    # ============================================================
    # FINAL VERIFICATION
    # ============================================================

    - name: Purge Dead Applications from Registry (Ghost Apps Wipe)
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        
        Write-Host "======================================================================"
        Write-Host "   [GHOST PURGE] DETECTING AND WIPING DEAD APPLICATIONS FROM REGISTRY "
        Write-Host "======================================================================"

        # Массив веток реестра, где Windows прячет списки установленного софта
        $registryPaths = @(
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )

        Write-Host "[SCANNING] Analyzing install paths for broken applications..."
        Write-Host "----------------------------------------------------------------------"

        foreach ($path in $registryPaths) {
            Get-ItemProperty -Path $path -ErrorAction SilentlyContinue | ForEach-Object {
                $appName = $_.DisplayName
                $registryKey = $_.PSChildName
                $parentPath = $_.PSParentPath -replace "Microsoft.PowerShell.Core\\Registry::", ""
                $fullKeyPath = "$parentPath\$registryKey"

                # Нам интересны только те записи, у которых есть имя
                if ($appName) {
                    $installDir = $_.InstallLocation
                    $uninstallStr = $_.UninstallString

                    $isDead = $false
                    $reason = ""

                    # Проверка 1: Если указана папка установки, но её физически нет на диске
                    if ($installDir -and -not (Test-Path -LiteralPath $installDir -ErrorAction SilentlyContinue)) {
                        $isDead = $true
                        $reason = "Missing InstallLocation: $installDir"
                    }
                    # Проверка 2: Если папки установки нет, проверяем сам файл деинсталлятора (первую часть строки до ключей)
                    elseif ($uninstallStr) {
                        # Выдергиваем чистый путь к .exe/.msi файлу (убираем кавычки и аргументы)
                        if ($uninstallStr -match '^"([^"]+)"') { $exePath = $Matches[1] }
                        else { $exePath = ($uninstallStr -split " ")[0] }

                        if ($exePath -and $exePath -match "🔮SYSTEMDRIVE🔮|🔮windir🔮|Program Files" -and -not (Test-Path -LiteralPath $exePath -ErrorAction SilentlyContinue)) {
                            $isDead = $true
                            $reason = "Missing Uninstaller EXE: $exePath"
                        }
                    }

                    # Если нашли мёртвую душу — выжигаем её нахрен из реестра!
                    if ($isDead) {
                        Write-Host "[GHOST FOUND] $appName" -ForegroundColor Yellow
                        Write-Host "  Reason: $reason" -ForegroundColor Gray
                        Write-Host "  Wiping Registry Key: $fullKeyPath" -ForegroundColor Cyan
                        
                        try {
                            # Удаляем ветку реестра со всеми подразделами абсолютно молча
                            Remove-Item -Path "Registry::$fullKeyPath" -Recurse -Force -ErrorAction Stop
                            Write-Host "  [REMOVED] Ghost app successfully erased from Windows lists!" -ForegroundColor Green
                        }
                        catch {
                            Write-Warning "  Failed to remove registry key: $fullKeyPath"
                        }
                        Write-Host "----------------------------------------------------------------------"
                    }
                }
            }
        }

        Write-Host "======================================================================"
        Write-Host "   [SUCCESS] Registry desynchronization fixed. All ghosts purged!     "
        Write-Host "======================================================================"

    - name: Verify preserved software
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          $apps += Get-ItemProperty `
            -Path $path `
            -ErrorAction SilentlyContinue
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName -Unique


        Write-Host ""
        Write-Host "============================================================"
        Write-Host "PRESERVED SOFTWARE"
        Write-Host "============================================================"


        Write-Host ""
        Write-Host "[Firefox]"

        $apps |
          Where-Object {
