        $ErrorActionPreference = 'Continue'

        $base = "$env:SYSTEMDRIVE\Program Files (x86)"

        if (-not (Test-Path -LiteralPath $base)) {
          Write-Host "[NOT FOUND] $base"
          exit 0
        }

        $androidDirs = Get-ChildItem `
          -LiteralPath $base `
          -Directory `
          -Force `
          -ErrorAction SilentlyContinue |
          Where-Object {
            $_.Name -match '(?i)^Android$'
          }

        foreach ($dir in $androidDirs) {
          Write-Host "[REMOVE] $($dir.FullName)"

          try {
            Remove-Item `
              -LiteralPath $dir.FullName `
              -Recurse `
              -Force `
              -ErrorAction Stop

            Write-Host "[REMOVED] $($dir.FullName)"
          }
          catch {
            Write-Warning "Failed to remove $($dir.FullName)"
