name: Windows Debloat & Cleanup
description: Aggressive Windows runner cleanup with selected development tools preserved
author: Veniamin668

branding:
  icon: trash-2
  color: red

inputs:
  enable:
    description: Enable cleanup
    required: false
    default: 'true'

  remove_services:
    description: Stop and remove unwanted services
    required: false
    default: 'true'

runs:
  using: composite
  steps:

    # ============================================================
    # STOP KNOWN UNWANTED SERVICES
    # ============================================================

    - name: Stop unwanted services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'PostgreSQL',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {
          $service = Get-Service -Name $name -ErrorAction SilentlyContinue

          if ($null -ne $service) {
            Write-Host "[STOP] $name"
            try {
              Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
            }
            catch {
              Write-Warning "Failed to stop service: $name"
            }
          }
        }

    # ============================================================
    # STOP UNWANTED PROCESSES
    # ============================================================

    - name: Stop unwanted processes
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $processes = @(
          'postgres',
          'postgresql',
          'mongod',
          'mongo',
          'httpd',
          'nginx',
          'mysqld',
          'mysql',
          'w3wp',
          'java',
          'javaw',
          'python',
          'python3',
          'conda',
          'ruby',
          'perl',
          'dotnet'
        )

        foreach ($name in $processes) {
          Get-Process -Name $name -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
        }

    # ============================================================
    # CHOCOLATEY ALLOWLIST CLEANUP
    #
    # Chocolatey handles the large package set first.
    # Registry cleanup below remains as a second pass for software
    # not controlled by Chocolatey or packages with broken metadata.
    # ============================================================

    - name: Remove Chocolatey packages except allowlist
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $allowPatterns = @(
          # Firefox
          '^firefox($|-)',
          '^mozilla-maintenance-service($|-)',

          # 7-Zip
          '^7zip($|-)',

          # CMake
          '^cmake($|[-.])',

          # Visual Studio and components
          '^visualstudio',
          '^visual-studio',
          '^vs-',
          '^vswhere($|-)',

          # Git
          '^git($|-)',
          '^git-for-windows($|-)',
          '^git-credential-manager($|-)',
          '^gcm($|-)',

          # GitHub CLI
          '^gh($|-)',
          '^github-cli($|-)',

          # Tailscale
          '^tailscale($|-)',

          # Docker
          '^docker($|-)',
          '^docker-desktop($|-)',
          '^docker-cli($|-)',
          '^docker-compose($|-)',
          '^docker-ce($|-)',
          '^docker-engine($|-)',

          # WSL / distributions
          '^wsl($|-)',
          '^wsl2($|-)',
          '^ubuntu($|-)',
          '^debian($|-)',
          '^kali($|-)',
          '^oraclelinux($|-)',
          '^opensuse($|-)',
          '^open-suse($|-)',
          '^suse($|-)',

          # Kubernetes
          '^kubernetes($|-)',
          '^kubectl($|-)',
          '^minikube($|-)',
          '^kind($|-)',

          # Node.js
          '^nodejs($|-)',
          '^nodejs-lts($|-)',
          '^npm($|-)',
          '^npx($|-)',

          # PowerShell
          '^powershell-core($|-)',
          '^powershell($|-)',
          '^pwsh($|-)'
        )

        function Test-ChocoAllowlist {
          param([string]$Id)

          foreach ($pattern in $allowPatterns) {
            if ($Id -match $pattern) {
              return $true
            }
          }

          return $false
        }

        if (-not (Get-Command choco.exe -ErrorAction SilentlyContinue)) {
          Write-Warning "[CHOCO] choco.exe not found - skipping Chocolatey pass"
          exit 0
        }

        Write-Host ""
        Write-Host "============================================================"
        Write-Host "CHOCOLATEY INSTALLED PACKAGES"
        Write-Host "============================================================"

        $lines = @(
          choco list --local-only --limit-output 2>$null
        )

        $packages = @()

        foreach ($line in $lines) {
          if ([string]::IsNullOrWhiteSpace($line)) {
            continue
          }

          # Chocolatey --limit-output format: packageId|version
          $parts = $line -split '\|', 2

          if ($parts.Count -lt 1) {
            continue
          }

          $id = $parts[0].Trim()
          $version = if ($parts.Count -gt 1) { $parts[1].Trim() } else { '' }

          if ([string]::IsNullOrWhiteSpace($id)) {
            continue
          }

          # Ignore Chocolatey's informational/header lines.
          if ($id -match '^(Chocolatey|packages installed|package name|local packages)$') {
            continue
          }

          $packages += [PSCustomObject]@{
            Id = $id
            Version = $version
          }
        }

        Write-Host "Found Chocolatey packages: $($packages.Count)"

        $removed = 0
        $kept = 0
        $failed = 0

        foreach ($pkg in $packages) {
          if (Test-ChocoAllowlist -Id $pkg.Id) {
            Write-Host "[CHOCO KEEP] $($pkg.Id) $($pkg.Version)"
            $kept++
            continue
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "[CHOCO REMOVE] $($pkg.Id) $($pkg.Version)"
          Write-Host "============================================================"

          & choco uninstall $pkg.Id -y --force --no-progress
          $exitCode = $LASTEXITCODE

          Write-Host "[EXIT CODE] $exitCode"

          # Chocolatey packages occasionally report a lifecycle-script
          # warning/non-zero code even though the package is actually gone.
          $stillInstalled = @(
            choco list --local-only --limit-output 2>$null |
              Where-Object {
                $_ -match ("(?i)^" + [regex]::Escape($pkg.Id) + "\|")
              }
          )

          if ($stillInstalled.Count -eq 0) {
            if ($exitCode -eq 0) {
              Write-Host "[REMOVED] $($pkg.Id)"
            }
            else {
              Write-Warning "[REMOVED WITH WARNING] $($pkg.Id) - Chocolatey exit code $exitCode, package is no longer installed"
            }

            $removed++
          }
          else {
            Write-Warning "[FAIL] Chocolatey failed to remove $($pkg.Id)"
            $failed++
          }
        }

        Write-Host ""
        Write-Host "============================================================"
        Write-Host "CHOCOLATEY SUMMARY"
        Write-Host "============================================================"
        Write-Host "Removed : $removed"
        Write-Host "Kept    : $kept"
        Write-Host "Failed  : $failed"
        Write-Host "============================================================"

    # ============================================================
    # EDGE / EDGE WEBVIEW2 SPECIAL UNINSTALLERS
    # ============================================================

    - name: Remove Microsoft Edge and WebView2
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        function Invoke-EdgeSetupUninstaller {
          param(
            [string[]]$Roots,
            [string[]]$Arguments,
            [string]$Label
          )

          $setups = @()

          foreach ($root in $Roots) {
            if (Test-Path -LiteralPath $root) {
              $setups += Get-ChildItem -LiteralPath $root -Directory -Force -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Join-Path $_.FullName 'Installer\setup.exe'
                }
            }
          }

          $setups = $setups |
            Where-Object { Test-Path -LiteralPath $_ } |
            Sort-Object -Unique

          foreach ($setup in $setups) {
            Write-Host "[EDGE UNINSTALL] $Label"
            Write-Host "  $setup"

            try {
              $p = Start-Process `
                -FilePath $setup `
                -ArgumentList $Arguments `
                -Wait `
                -PassThru `
                -NoNewWindow

              Write-Host "[EDGE EXIT CODE] $($p.ExitCode)"
            }
            catch {
              Write-Warning "Failed to run $Label uninstaller: $setup"
            }
          }
        }

        Invoke-EdgeSetupUninstaller `
          -Roots @(
            'C:\Program Files (x86)\Microsoft\Edge\Application',
            'C:\Program Files\Microsoft\Edge\Application'
          ) `
          -Arguments @(
            '--uninstall',
            '--system-level',
            '--force-uninstall'
          ) `
          -Label 'Microsoft Edge'

        Invoke-EdgeSetupUninstaller `
          -Roots @(
            'C:\Program Files (x86)\Microsoft\EdgeWebView\Application',
            'C:\Program Files\Microsoft\EdgeWebView\Application'
          ) `
          -Arguments @(
            '--uninstall',
            '--msedgewebview',
            '--system-level',
            '--force-uninstall'
          ) `
          -Label 'Microsoft Edge WebView2'

    # ============================================================
    # POSTGRESQL / EDB SPECIAL SILENT UNINSTALLER
    #
    # PostgreSQL for Windows uses InstallBuilder's uninstaller.
    # If launched normally it can open a GUI, which is unacceptable
    # on a remote GitHub runner. Always force unattended/no-UI mode.
    # ============================================================

    - name: Remove PostgreSQL silently
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $uninstallers = @()

        # Standard EDB installation locations.
        $roots = @(
          'C:\Program Files\PostgreSQL',
          'C:\Program Files (x86)\PostgreSQL',
          'C:\PostgreSQL'
        )

        foreach ($root in $roots) {
          if (-not (Test-Path -LiteralPath $root)) {
            continue
          }

          $uninstallers += Get-ChildItem -LiteralPath $root -Recurse -File -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ieq 'uninstall-postgresql.exe' } |
            Select-Object -ExpandProperty FullName
        }

        $uninstallers = $uninstallers | Sort-Object -Unique

        if ($uninstallers.Count -eq 0) {
          Write-Host '[POSTGRESQL] No EDB uninstall-postgresql.exe found'
        }
        else {
          foreach ($exe in $uninstallers) {
            Write-Host ''
            Write-Host '============================================================'
            Write-Host '[POSTGRESQL SILENT UNINSTALL]'
            Write-Host "  EXE: $exe"
            Write-Host '============================================================'

            try {
              $p = Start-Process `
                -FilePath $exe `
                -ArgumentList @(
                  '--mode', 'unattended',
                  '--unattendedmodeui', 'none'
                ) `
                -Wait `
                -PassThru `
                -NoNewWindow

              Write-Host "[POSTGRESQL EXIT CODE] $($p.ExitCode)"

              if ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) {
                Write-Host '[POSTGRESQL] Silent uninstall completed'
              }
              else {
                Write-Warning "[POSTGRESQL] Uninstaller returned exit code $($p.ExitCode)"
              }
            }
            catch {
              Write-Warning "[POSTGRESQL] Failed to run $exe"
              Write-Warning $_
            }
          }
        }

    # ============================================================
    # OLD REGISTRY UNINSTALL METHOD
    #
    # This intentionally stays after Chocolatey.
    # It catches ordinary registry uninstallers and software that
    # Chocolatey did not manage.
    # ============================================================

    - name: Remove everything except allowlist (registry pass)
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $allowDisplayPatterns = @(
          # Firefox + its maintenance service
          '^Mozilla Firefox',
          '^Firefox',
          '^Mozilla Maintenance Service',

          # Visual Studio
          '^Visual Studio',
          '^Microsoft Visual Studio',
          '^Visual Studio Installer',
          '^VS Installer',
          '^vs_',
          '^sptools_Microsoft\.VisualStudio',
          '^Microsoft Visual Studio Setup',

          # Git
          '^Git$',
          '^Git for Windows',
          '^Git Credential Manager',
          '^Git LFS',

          # GitHub CLI
          '^GitHub CLI',
          '^GitHub Command Line Interface',

          # 7-Zip
          '^7-Zip',

          # CMake
          '^CMake',

          # Tailscale
          '^Tailscale',

          # Docker
          '^Docker',

          # WSL
          '^Windows Subsystem for Linux',
          '^WSL',
          '^Ubuntu',
          '^Debian',
          '^Kali Linux',
          '^Oracle Linux',
          '^openSUSE',
          '^SUSE',

          # Kubernetes
          '^Kubernetes',
          '^kubectl',
          '^Minikube',
          '^kind',

          # Node.js
          '^Node\.js',
          '^NodeJS',
          '^npm',
          '^npx',

          # PowerShell
          '^PowerShell'
        )

        function Test-DisplayAllowlist {
          param([string]$Name)

          foreach ($pattern in $allowDisplayPatterns) {
            if ($Name -match "(?i)$pattern") {
              return $true
            }
          }

          return $false
        }

        function Invoke-UninstallCommand {
          param(
            [string]$Command,
            [string]$Name
          )

          if ([string]::IsNullOrWhiteSpace($Command)) {
            return $false
          }

          $command = $Command.Trim()

          # Handle .bat/.cmd without breaking paths containing spaces.
          if ($command -match '(?i)\.(bat|cmd)(?:\s|$)') {
            $p = Start-Process `
              -FilePath 'cmd.exe' `
              -ArgumentList @('/d', '/s', '/c', "call $command") `
              -Wait `
              -PassThru `
              -NoNewWindow

            return ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010)
          }

          # Parse quoted executable path correctly.
          $exe = $null
          $args = $null

          if ($command -match '^\s*"([^"]+)"\s*(.*)$') {
            $exe = $matches[1]
            $args = $matches[2]
          }
          elseif ($command -match '^\s*([^\s]+)\s*(.*)$') {
            $exe = $matches[1]
            $args = $matches[2]
          }

          if ([string]::IsNullOrWhiteSpace($exe)) {
            return $false
          }

          # PostgreSQL / EDB InstallBuilder.
          # Never launch its GUI on a runner.
          if (
            $Name -match '(?i)PostgreSQL|EDB Postgres|Postgres' -and
            $exe -match '(?i)(^|\\)uninstall-postgresql\.exe$'
          ) {
            $argumentList = @(
              '--mode', 'unattended',
              '--unattendedmodeui', 'none'
            )

            Write-Host "[POSTGRESQL SILENT UNINSTALL] $Name"
            Write-Host "  EXE: $exe"
            Write-Host '  ARGS: --mode unattended --unattendedmodeui none'

            try {
              $p = Start-Process `
                -FilePath $exe `
                -ArgumentList $argumentList `
                -Wait `
                -PassThru `
                -NoNewWindow

              return (
                $p.ExitCode -eq 0 -or
                $p.ExitCode -eq 1605 -or
                $p.ExitCode -eq 1614 -or
                $p.ExitCode -eq 3010
              )
            }
            catch {
              Write-Warning "[POSTGRESQL UNINSTALL ERROR] $Name"
              Write-Warning $_
              return $false
            }
          }

          # Inno Setup
          if ($exe -match '(?i)unins\d*\.exe$') {
            if ($args -notmatch '(?i)/VERYSILENT') {
              $args = ($args + ' /VERYSILENT /SUPPRESSMSGBOXES /NORESTART').Trim()
            }
          }
          # NSIS
          elseif ($exe -match '(?i)(^|\\)uninstall\.exe$') {
            if ($args -notmatch '(?i)\s/S\b') {
              $args = ($args + ' /S').Trim()
            }
          }

          $argumentList = @()
          if (-not [string]::IsNullOrWhiteSpace($args)) {
            $argumentList = $args
          }

          Write-Host "[UNINSTALL] $Name"
          Write-Host "  EXE: $exe"
          if ($argumentList) {
            Write-Host "  ARGS: $args"
          }

          try {
            $p = Start-Process `
              -FilePath $exe `
              -ArgumentList $argumentList `
              -Wait `
              -PassThru `
              -NoNewWindow

            # Common successful Windows/MSI uninstall results.
            return (
              $p.ExitCode -eq 0 -or
              $p.ExitCode -eq 1605 -or
              $p.ExitCode -eq 1614 -or
              $p.ExitCode -eq 3010
            )
          }
          catch {
            Write-Warning "[UNINSTALL ERROR] $Name"
            Write-Warning $_
            return $false
          }
        }

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          try {
            $apps += Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
          }
          catch {
          }
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName, PSPath -Unique

        $removed = 0
        $kept = 0
        $failed = 0
        $skipped = 0

        foreach ($app in $apps) {
          $name = $app.DisplayName

          if (Test-DisplayAllowlist -Name $name) {
            Write-Host "[KEEP] $name"
            $kept++
            continue
          }

          $uninstall = $app.QuietUninstallString

          if ([string]::IsNullOrWhiteSpace($uninstall)) {
            $uninstall = $app.UninstallString
          }

          if ([string]::IsNullOrWhiteSpace($uninstall)) {
            Write-Host "[NO UNINSTALLER] $name"
            $skipped++
            continue
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "[REMOVE] $name"
          Write-Host "============================================================"

          if (Invoke-UninstallCommand -Command $uninstall -Name $name) {
            Write-Host "[REMOVED] $name"
            $removed++
          }
          else {
            Write-Warning "[FAILED] $name"
            $failed++
          }
        }

        Write-Host ""
        Write-Host "============================================================"
        Write-Host "REGISTRY UNINSTALL SUMMARY"
        Write-Host "============================================================"
        Write-Host "Removed : $removed"
        Write-Host "Kept    : $kept"
        Write-Host "Skipped : $skipped"
        Write-Host "Failed  : $failed"
        Write-Host "============================================================"

    # ============================================================
    # REMOVE KNOWN LEFTOVER DIRECTORIES
    # ============================================================

    - name: Remove known leftover directories
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $paths = @(
          'C:\hostedtoolcache',
          'C:\ghcup',
          'C:\Julia',
          'C:\PostgreSQL',
          'C:\mingw32',
          'C:\mingw64',
          'C:\selenium',
          'C:\seleniumWebDrivers',
          'C:\Strawberry',
          'C:\msys64',
          'C:\Program Files (x86)\Android',
          'C:\Program Files\Android'
        )

        foreach ($path in $paths) {
          if (-not (Test-Path -LiteralPath $path)) {
            Write-Host "[NOT FOUND] $path"
            continue
          }

          Write-Host "[REMOVE] $path"

          try {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
            Write-Host "[REMOVED] $path"
          }
          catch {
            Write-Warning "Failed to completely remove $path"
            Write-Warning $_
          }
        }

    # ============================================================
    # CLEAN STALE SYSTEM / USER ENVIRONMENT VARIABLES
    # ============================================================

    - name: Clean stale environment variables
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $badRoots = @(
          'C:\hostedtoolcache',
          'C:\ghcup',
          'C:\Julia',
          'C:\PostgreSQL',
          'C:\mingw32',
          'C:\mingw64',
          'C:\selenium',
          'C:\seleniumWebDrivers',
          'C:\Strawberry',
          'C:\msys64',
          'C:\Program Files (x86)\Android',
          'C:\Program Files\Android'
        )

        $badVariableNames = @(
          'JAVA_HOME',
          'JDK_HOME',
          'JRE_HOME',
          'ANDROID_HOME',
          'ANDROID_SDK_ROOT',
          'ANDROID_NDK_HOME',
          'GHCUP_INSTALL_BASE_PREFIX',
          'GHCUP_INSTALL_DIR',
          'CABAL_HOME',
          'STACK_ROOT',
          'JULIA_HOME',
          'JULIA_DEPOT_PATH',
          'MINGW_HOME',
          'MSYS2_PATH_TYPE',
          'PYTHONHOME',
          'PYTHONPATH',
          'CONDA_PREFIX',
          'CONDA_DEFAULT_ENV',
          'POSTGRES_HOME',
          'PGDATA'
        )

        function Test-BadRoot {
          param([string]$Value)

          if ([string]::IsNullOrWhiteSpace($Value)) {
            return $false
          }

          foreach ($root in $badRoots) {
            if ($Value.IndexOf($root, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              return $true
            }
          }

          return $false
        }

        function Clean-PathValue {
          param([string]$Value)

          if ([string]::IsNullOrWhiteSpace($Value)) {
            return $Value
          }

          $entries = $Value -split ';'
          $clean = @()

          foreach ($entry in $entries) {
            $item = $entry.Trim()

            if ([string]::IsNullOrWhiteSpace($item)) {
              continue
            }

            if (Test-BadRoot -Value $item) {
              Write-Host "[PATH REMOVE] $item"
              continue
            }

            $clean += $item
          }

          return ($clean -join ';')
        }

        foreach ($scope in @('Machine', 'User')) {
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CLEANING $scope ENVIRONMENT"
          Write-Host "============================================================"

          try {
            $variables = [Environment]::GetEnvironmentVariables($scope)

            foreach ($entry in @($variables.GetEnumerator())) {
              $name = [string]$entry.Key
              $value = [string]$entry.Value

              if ($name -ieq 'Path') {
                $cleanedPath = Clean-PathValue -Value $value

                if ($cleanedPath -ne $value) {
                  try {
                    [Environment]::SetEnvironmentVariable('Path', $cleanedPath, $scope)
                    Write-Host "[ENV CLEAN] $scope Path"
                  }
                  catch {
                    Write-Warning "Could not update $scope Path"
                  }
                }

                continue
              }

              $removeVariable = (
                $badVariableNames -contains $name -or
                (Test-BadRoot -Value $value)
              )

              if ($removeVariable) {
                try {
                  [Environment]::SetEnvironmentVariable($name, $null, $scope)
                  Write-Host "[ENV REMOVE] $scope $name"
                }
                catch {
                  Write-Warning "Could not remove $scope variable: $name"
                }
              }
            }
          }
          catch {
            Write-Warning "Could not enumerate $scope environment variables"
          }
        }

        # Clean the current action process as well.
        $env:Path = Clean-PathValue -Value $env:Path

        foreach ($name in $badVariableNames) {
          Remove-Item "Env:$name" -ErrorAction SilentlyContinue
        }

        # Make the cleaned PATH available to later GitHub Actions steps.
        if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_ENV)) {
          Add-Content -Path $env:GITHUB_ENV -Value "Path=$env:Path"
          Write-Host "[GITHUB_ENV] Cleaned PATH exported"
        }

    # ============================================================
    # REMOVE LEFTOVER UNWANTED SERVICES
    # ============================================================

    - name: Remove leftover unwanted services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'PostgreSQL',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {
          $service = Get-Service -Name $name -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            continue
          }

          Write-Host "[DELETE SERVICE] $name"

          try {
            & sc.exe delete $name
          }
          catch {
            Write-Warning "Could not delete service: $name"
          }
        }

    # ============================================================
    # FINAL VERIFICATION
    # ============================================================

    - name: Verify preserved software
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          $apps += Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName -Unique

        Write-Host ""
        Write-Host "============================================================"
        Write-Host "PRESERVED SOFTWARE"
        Write-Host "============================================================"

        $groups = [ordered]@{
          'Firefox' = '(?i)(Firefox|Mozilla Maintenance Service)'
          'Visual Studio' = '(?i)(Visual Studio|^vs_|sptools_Microsoft\.VisualStudio)'
          'Git' = '(?i)^Git($| for Windows| Credential Manager| LFS)'
          'GitHub CLI' = '(?i)^GitHub (CLI|Command Line Interface)'
          '7-Zip' = '(?i)^7-Zip'
          'CMake' = '(?i)^CMake'
          'Tailscale' = '(?i)Tailscale'
          'Docker' = '(?i)^Docker'
          'WSL / Kubernetes' = '(?i)(Windows Subsystem for Linux|^WSL|Ubuntu|Debian|Kali Linux|Kubernetes|kubectl|Minikube|^kind)'
          'Node.js' = '(?i)(^Node\.js|^NodeJS|^npm|^npx)'
          'PowerShell' = '(?i)^PowerShell'
        }

        foreach ($group in $groups.GetEnumerator()) {
          Write-Host ""
          Write-Host "[$($group.Key)]"

          $matches = $apps |
            Where-Object { $_.DisplayName -match $group.Value }

          if ($matches.Count -eq 0) {
            Write-Host "  [NOT FOUND]"
          }
          else {
            foreach ($app in $matches) {
              Write-Host "  $($app.DisplayName)"
            }
          }
        }

        Write-Host ""
        Write-Host "============================================================"
        Write-Host "WINDOWS DEBLOAT COMPLETED"
        Write-Host "============================================================"
