name: Windows Debloat & Cleanup
description: Aggressive Windows runner cleanup with selected development tools preserved
author: Windows Debloat & Cleanup

branding:
  icon: trash-2
  color: red
  
inputs:
  enable:
    description: Enable cleanup
    required: false
    default: 'true'

  remove_services:
    description: Stop and remove unwanted services
    required: false
    default: 'true'
  
  azure-del:
   description: Remove folder C:\Modules azure modules
   required: false
   default: 'true'
  
  choco-del:
   description: chocolatey remove
   required: false
   default: 'true'
 
  uwp-del:
   description: Delete UWP Apps
   required: false
   default: 'true'
 
  path-clean:
    description: 'Clean up dead paths from PATH and remove garbage environment variables'
    required: false
    default: 'true'

  del-installer-user:
    description: 'Remove user installer?'
    required: false
    default: 'true'

  oobe-disable:
    description: 'Kill WWAHost and WSL trigger(oobe privacy settings)?'
    required: false
    default: 'true'
    
  wsl-rename:
    description: 'Kill WSL trigger?'
    required: false
    default: 'false'
      
  optimize:
    description: 'Optimize windows?'
    required: false
    default: 'true'
    
  npm-del:
    description: 'Remove C:\npm folder?'
    required: false
    default: 'true'

runs:
  using: composite
  steps:

    - name: Pre-Emptive Defender Nuclear Neutralization
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host "======================================================================"
        Write-Host "   [PRE-EMPTIVE] INJECTING POLICIES TO BYPASS TAMPER CORE             "
        Write-Host "======================================================================"

        # 1. Глушим мониторинг и исключения на уровне встроенных преференций (Тампер это хавает!)
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
        Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
        Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue
        Set-MpPreference -DisableBlockAtFirstSeen $true -ErrorAction SilentlyContinue
        
        # Вносим весь диск C: в список исключений! Если он не может отключиться, пускай просто ничего не сканирует!
        Add-MpPreference -ExclusionPath "C:\" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "D:\" -ErrorAction SilentlyContinue
        Write-Host " >> [POLICY] All active volumes added to Defender exclusions matrix!" -ForegroundColor Green

        # 2. Жёстко забиваем политики отключения через обычный реестр (GPO Override)
        $gpoPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender"
        if (!(Test-Path $gpoPath)) { New-Item -Path $gpoPath -Force >$null 2>&1 }
        Set-ItemProperty -Path $gpoPath -Name "DisableAntiSpyware" -Value 1 -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path $gpoPath -Name "DisableAntiVirus" -Value 1 -Force -ErrorAction SilentlyContinue
        
        $realtimePath = "$gpoPath\Real-Time Protection"
        if (!(Test-Path $realtimePath)) { New-Item -Path $realtimePath -Force >$null 2>&1 }
        Set-ItemProperty -Path $realtimePath -Name "DisableRealtimeMonitoring" -Value 1 -Force -ErrorAction SilentlyContinue

        Write-Host "======================================================================"
        $LASTEXITCODE = 0

    - name: Hardcore OOBE Suppressor
      if: ${{ inputs.oobe-disable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host "=== Вырезаем WWAHost (OOBE) ==="
        
        $filePath = "$env:windir\System32\WWAHost.exe"
        
        # Гасим процесс в памяти
        Stop-Process -Name "WWAHost" -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 1

        if (Test-Path -LiteralPath $filePath) {
            Write-Host "Файл найден: WWAHost.exe. Перехватываем права..."
            takeown /f $filePath /a > $null
            icacls $filePath /grant *S-1-5-32-544:F > $null
            
            Write-Host "Переименовываем файл..."
            Rename-Item -Path $filePath -NewName "WWAHost.exe123" -Force -ErrorAction SilentlyContinue
            
            if (Test-Path -LiteralPath "$filePath`123") {
                Write-Host "[УСПЕХ] WWAHost.exe успешно переименован в WWAHost.exe123!"
            } else {
                Write-Host "[ВНИМАНИЕ] Не удалось переименовать WWAHost.exe"
            }
        } else {
            Write-Host "WWAHost.exe уже отсутствует или переименован."
        }
        exit 0

    - name: WSL Kill and Renamer
      if: ${{ inputs.wsl-rename == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host "=== Вырезаем WSL бинарники и процессы ==="
        
        $filePath = "$env:windir\System32\wsl.exe"
        
        # Гасим процесс, чтобы закрыть вылезшие окна
        Stop-Process -Name "wsl" -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 1

        if (Test-Path -LiteralPath $filePath) {
            Write-Host "Файл найден: wsl.exe. Перехватываем права..."
            takeown /f $filePath /a > $null
            icacls $filePath /grant *S-1-5-32-544:F > $null
            
            Write-Host "Переименовываем файл..."
            Rename-Item -Path $filePath -NewName "wsl.exe123" -Force -ErrorAction SilentlyContinue
            
            if (Test-Path -LiteralPath "$filePath`123") {
                Write-Host "[УСПЕХ] wsl.exe успешно переименован в wsl.exe123!"
            } else {
                Write-Host "[ВНИМАНИЕ] Не удалось переименовать wsl.exe"
            }
        } else {
            Write-Host "wsl.exe уже отсутствует или переименован."
        }
        exit 0

    - name: Install Hardcore Elevation Tool (gsudo)
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host "======================================================================"
        Write-Host "   [SETUP] DEPLOYING GSUDO VIA CHOCOLATEY FOR KERNEL BYPASS           "
        Write-Host "======================================================================"
        
        # Ставим тихо утилиту повышения прав через шоколадку
        choco install gsudo -y --no-progress >$null 2>&1
        
        # Перечитываем Path прямо в текущем процессе, чтобы система сразу его увидела
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
        
        if (Get-Command gsudo.exe -ErrorAction SilentlyContinue) {
            Write-Host "   [SUCCESS] gsudo is ready to bypass Windows security layers!" -ForegroundColor Green
        }
        Write-Host "======================================================================"

    - name: Low-Level Cloud PC & Hardware System Optimizer
      if: ${{ inputs.enable == 'true' && inputs.optimize == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host "======================================================================"
        Write-Host "   [HARDWARE BOOST] EXECUTING STORAGE TRIM & CPU PRIORITIZATION      "
        Write-Host "======================================================================"

        # Перечитываем Path, чтобы намертво зафиксировать gsudo в сессии
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")

        # СХЕМА ПИТАНИЯ: Врубаем максимальную производительность
        Write-Host " >> [TWEAK] Activating Ultimate Performance Power Plan..." -ForegroundColor Cyan
        powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

        # NTFS ТВИКИ БЕЗ РЕБУТА: Отключаем DOS-имена (8.3) и метки времени доступа
        Write-Host " >> [NTFS TWEAK] Tuning file system allocation structures..." -ForegroundColor Cyan
        fsutil behavior set disableDeleteNotify NTFS 0 >$null 2>&1
        fsutil behavior set disable8dot3 1 >$null 2>&1
        fsutil behavior set disablelastaccess 1 >$null 2>&1

        # ДИНАМИЧЕСКИЙ TRIM: Ищем все активные диски (C:, D:) и оптимизируем SSD/NVMe
        Write-Host " >> [SCANNING] Detecting active storage volumes for dynamic TRIM..." -ForegroundColor Cyan
        Get-Volume | Where-Object { $_.DriveLetter -and $_.FileSystem -eq "NTFS" } | ForEach-Object {
            $letter = $_.DriveLetter
            try { defrag.exe "${letter}:" /L /U /V } catch {}
        }

        # CPU ТВИК ПОД ПЛАВНЫЙ RDP: Режим "Программы" (значение 2) для 60 FPS
        Write-Host " >> [TWEAK] Adjusting Win32PrioritySeparation to foreground apps (2)..." -ForegroundColor Cyan
        if (Get-Command gsudo.exe -ErrorAction SilentlyContinue) {
            gsudo.exe --ti reg add "HKLM\SYSTEM\CurrentControlSet\Control\PriorityControl" /v "Win32PrioritySeparation" /t REG_DWORD /d 2 /f >$null 2>&1
        } else {
            reg add "HKLM\SYSTEM\CurrentControlSet\Control\PriorityControl" /v "Win32PrioritySeparation" /t REG_DWORD /d 2 /f >$null 2>&1
        }
        
        # СЕТЕВОЙ ТВИК: Глушим Multimedia Throttling Index, чтобы поток летал без затыков
        Write-Host " >> [TWEAK] Disabling network multimedia throttling profiles..." -ForegroundColor Cyan
        if (Test-Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile") {
            Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Name "NetworkThrottlingIndex" -Value 4294967295 -Force
            Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Name "SystemResponsiveness" -Value 0 -Force
        }

        # ИНЪЕКЦИЯ IDENTITY ДЛЯ ПРИКОЛА И ТЕСТОВ CLOUD PC
        Write-Host " >> [SPOOFING] Injecting Windows 365 Cloud PC architecture flags..." -ForegroundColor Cyan
        if (Get-Command gsudo.exe -ErrorAction SilentlyContinue) {
            gsudo.exe --ti reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CloudPC" /v "IsCloudPC" /t REG_DWORD /d 1 /f >$null 2>&1
            gsudo.exe --ti reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CloudPC" /v "CloudPCProvider" /t REG_SZ /d "GitHub_Actions_Premium_Sandbox" /f >$null 2>&1
            gsudo.exe --ti reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v "VisualFXSetting" /t REG_DWORD /d 2 /f >$null 2>&1
            gsudo.exe --ti reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v "BPP" /t REG_DWORD /d 32 /f >$null 2>&1
        }

        Write-Host "======================================================================"
        Write-Host "   [SUCCESS] Storage layer, Network and Cloud PC spoofing deployed!  "
        Write-Host "======================================================================"
        exit 0
    
    - name: Disable selected Windows services via TrustedInstaller
      if: inputs.enable == 'true' && inputs.optimize == 'true'
      shell: pwsh
      run: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
        Write-Host "========== Отключение выбранных Windows служб через TrustedInstaller ==========" -ForegroundColor Cyan

        # Список служб для отключения.
        # Добавляй новые службы через запятую:
        # "Service1",
        # "Service2",
        # "Service3"
        $ServicesToDisable = @(
            "WinDefend",
            "WdNisSvc",
            "MDCoreSvc",
            "Sense",
            "SecurityHealthService",
            "DoSvc",
            "whesvc",
            "WaaSMedicSvc",
            "UsoSvc"
        )

        # Приводим список к нормальному виду и убираем дубли
        $ServicesToDisable = $ServicesToDisable |
            ForEach-Object { $_.Trim() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -Unique

        Write-Host "[*] Подготовлено служб к отключению: $($ServicesToDisable.Count)" -ForegroundColor Cyan

        foreach ($ServiceName in $ServicesToDisable) {
            Write-Host ""
            Write-Host "========== ${ServiceName} ==========" -ForegroundColor Cyan

            $Service = Get-CimInstance Win32_Service -Filter "Name='$ServiceName'" -ErrorAction SilentlyContinue

            if ($null -eq $Service) {
                Write-Host "[!] Служба не найдена: ${ServiceName}" -ForegroundColor DarkYellow
                continue
            }

            Write-Host "[+] Найдена: $($Service.DisplayName)" -ForegroundColor Green
            Write-Host "[*] Состояние: $($Service.State)" -ForegroundColor Gray
            Write-Host "[*] StartMode: $($Service.StartMode)" -ForegroundColor Gray

            # 1. Останавливаем службу через TrustedInstaller
            if ($Service.State -ne "Stopped") {
                Write-Host "[*] Останавливаем службу через TrustedInstaller..." -ForegroundColor Yellow

                gsudo.exe --ti powershell.exe -NoProfile -Command "Stop-Service -Name '$ServiceName' -Force -ErrorAction SilentlyContinue" 2>&1 |
                    ForEach-Object { Write-Host $_ }

                Start-Sleep -Milliseconds 500
            }
            else {
                Write-Host "[+] Служба уже остановлена." -ForegroundColor Green
            }

            # 2. Устанавливаем Start=4 через TrustedInstaller
            Write-Host "[*] Устанавливаем Start=4 (Disabled) через TrustedInstaller..." -ForegroundColor Yellow

            gsudo.exe --ti powershell.exe -NoProfile -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\$ServiceName' -Name 'Start' -Type DWord -Value 4" 2>&1 |
                ForEach-Object { Write-Host $_ }

            # 3. Повторно останавливаем службу через TrustedInstaller
            Write-Host "[*] Повторно останавливаем службу через TrustedInstaller..." -ForegroundColor Yellow

            gsudo.exe --ti powershell.exe -NoProfile -Command "Stop-Service -Name '$ServiceName' -Force -ErrorAction SilentlyContinue" 2>&1 |
                ForEach-Object { Write-Host $_ }

            Write-Host "[+] ${ServiceName}: остановлена и переведена в Start=4." -ForegroundColor Green
        }

        Write-Host ""
        Write-Host "[+] Все выбранные службы обработаны." -ForegroundColor Green
        
    - name: Purge Firefox completely
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host "======================================================================"
        Write-Host "   NO VARIABLES EDITION                                     "
        Write-Host "======================================================================"

        Start-Process -FilePath "$env:SYSTEMDRIVE\Program Files\Mozilla Firefox\uninstall\helper.exe" -ArgumentList "/S" -Wait -NoNewWindow -ErrorAction SilentlyContinue
        Write-Host "======================================================================"
        Write-Host "   [SUCCESS] Firefox completely eradicated from disk!                "
        Write-Host "======================================================================"


    - name: Remove unwanted UWP applications
      if: inputs.uwp-del == 'true'
      shell: pwsh
      run: |
          $ErrorActionPreference = 'Continue'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "          UWP / APPX DEBLOAT CLEANUP" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""

          # ============================================================
          # Applications that MUST remain on the GitHub Actions runner.
          # Everything else that is a removable UWP application will be
          # targeted for removal.
          # ============================================================

          $ApplicationAllowList = @(
              'Microsoft.WindowsNotepad'
              'Microsoft.Paint'
              'Microsoft.ScreenSketch'
              'Microsoft.WindowsStore'
              'Microsoft.WindowsTerminal'

              # Keep WSL.
              'MicrosoftCorporationII.WindowsSubsystemForLinux'
          )

          # ============================================================
          # Windows system AppX packages.
          #
          # These are not normal user applications. Removing them can
          # break Windows shell, login, OOBE, dialogs, security UI,
          # accessibility, networking, etc.
          # DELETE:
          # 'Microsoft.SecHealthUI'
          # 'Microsoft.StartExperiencesApp'
          # 'Microsoft.Win32WebViewHost'
          # 'Microsoft.Windows.ParentalControls'
          # 'MicrosoftWindows.Client.CoreAI'
          # 'MicrosoftWindows.61869720.Voiess'
          # 'MicrosoftWindows.61869721.Livtop'
          # 'MicrosoftWindows.61869722.Speion'
          # 'Microsoft.Windows.Apprep.ChxApp'
          # 'Microsoft.Windows.AugLoop.CBS'
          # 'MicrosoftWindows.CrossDevice'
          # ============================================================
          $SystemAllowList = @(
              'Microsoft.AAD.BrokerPlugin'
              'Microsoft.AccountsControl'
              'Microsoft.ApplicationCompatibilityEnhancements'
              'Microsoft.AsyncTextService'
              'Microsoft.BioEnrollment'
              'Microsoft.CredDialogHost'
              'Microsoft.ECApp'
              'Microsoft.LockApp'
              
              'Microsoft.Windows.AssignedAccessLockApp'
              'Microsoft.Windows.CapturePicker'
              'Microsoft.Windows.CloudExperienceHost'
              'Microsoft.Windows.ContentDeliveryManager'
              'Microsoft.Windows.NarratorQuickStart'
              'Microsoft.Windows.OOBENetworkCaptivePortal'
              'Microsoft.Windows.OOBENetworkConnectionFlow'
              'Microsoft.Windows.PeopleExperienceHost'
              'Microsoft.Windows.PinningConfirmationDialog'
              'Microsoft.Windows.PrintQueueActionCenter'
              'Microsoft.Windows.SecureAssessmentBrowser'
              'Microsoft.Windows.ShellExperienceHost'
              'Microsoft.Windows.StartMenuExperienceHost'
              'Microsoft.Windows.XGpuEjectDialog'

              'MicrosoftWindows.61869836.InpApp'

              'MicrosoftWindows.Client.CBS'
              
              'MicrosoftWindows.Client.FileExp'
              'MicrosoftWindows.Client.Core'
              'MicrosoftWindows.Client.OOBE'
              'MicrosoftWindows.Client.Photon'

              # NOTE:
              # MicrosoftWindows.Client.WebExperience is intentionally
              # NOT here because it hosts Windows Widgets / Web Experience
              # components and is unwanted on a CI runner.

              'MicrosoftWindows.UndockedDevKit'

              'Windows.CBSPreview'
              'windows.immersivecontrolpanel'
              'Windows.PrintDialog'
          )

          # ============================================================
          # Framework/runtime packages.
          #
          # Keep these because Windows and other applications may depend
          # on them. They are not normal end-user applications.
          # ============================================================

          $FrameworkAllowList = @(
              'Microsoft.NET.Native.Framework.2.2'
              'Microsoft.NET.Native.Runtime.2.2'

              'Microsoft.UI.Xaml.2.8'
              'Microsoft.UI.Xaml.CBS'

              'Microsoft.VCLibs.140.00'
              'Microsoft.VCLibs.140.00.UWPDesktop'

              'Microsoft.WindowsAppRuntime.1.6'
              'Microsoft.WindowsAppRuntime.1.7'
              'Microsoft.WindowsAppRuntime.1.8'
              'Microsoft.WindowsAppRuntime.2'

              'Microsoft.WindowsAppRuntime.CBS.1.6'
              'Microsoft.WindowsAppRuntime.CBS.2'
          )

          # ============================================================
          # Complete keep list.
          # ============================================================

          $KeepList = @(
              $ApplicationAllowList
              $SystemAllowList
              $FrameworkAllowList
          )

          Write-Host "Applications explicitly preserved:" -ForegroundColor Green

          foreach ($Name in $ApplicationAllowList) {
              Write-Host "  KEEP  $Name" -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "Scanning installed AppX packages..." -ForegroundColor Cyan
          Write-Host ""

          # ============================================================
          # Installed AppX packages
          # ============================================================

          $InstalledPackages = @(
              Get-AppxPackage -AllUsers |
                  Sort-Object Name, PackageFullName
          )

          $RemovedCount = 0
          $KeptCount = 0
          $FailedCount = 0

          foreach ($Package in $InstalledPackages) {

              $Name = $Package.Name
              $FullName = $Package.PackageFullName

              if ($KeepList -contains $Name) {

                  Write-Host "KEEP    $Name" -ForegroundColor DarkGreen
                  $KeptCount++

                  continue
              }

              Write-Host "REMOVE  $Name" -ForegroundColor Yellow

              try {

                  Remove-AppxPackage `
                      -Package $FullName `
                      -AllUsers `
                      -ErrorAction Stop

                  Write-Host "        [OK] $Name removed" -ForegroundColor Green

                  $RemovedCount++
              }
              catch {

                  Write-Host "        [WARN] Could not remove $Name" -ForegroundColor DarkYellow
                  Write-Host "        $($_.Exception.Message)" -ForegroundColor DarkYellow

                  $FailedCount++
              }
          }

          # ============================================================
          # Provisioned AppX packages
          #
          # Removing these prevents Windows from provisioning the
          # unwanted application again for another user.
          # ============================================================

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "       PROVISIONED APPX PACKAGE CLEANUP" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""

          $ProvisionedPackages = @(
              Get-AppxProvisionedPackage -Online |
                  Sort-Object DisplayName, PackageName
          )

          $ProvisionedRemovedCount = 0
          $ProvisionedKeptCount = 0
          $ProvisionedFailedCount = 0

          foreach ($Package in $ProvisionedPackages) {

              $Name = $Package.DisplayName
              $PackageName = $Package.PackageName

              if ($KeepList -contains $Name) {

                  Write-Host "KEEP    provisioned $Name" -ForegroundColor DarkGreen
                  $ProvisionedKeptCount++

                  continue
              }

              Write-Host "REMOVE  provisioned $Name" -ForegroundColor Yellow

              try {

                  Remove-AppxProvisionedPackage `
                      -Online `
                      -PackageName $PackageName `
                      -ErrorAction Stop |
                      Out-Null

                  Write-Host "        [OK] $Name removed from provisioning" -ForegroundColor Green

                  $ProvisionedRemovedCount++
              }
              catch {

                  Write-Host "        [WARN] Could not remove provisioned $Name" -ForegroundColor DarkYellow
                  Write-Host "        $($_.Exception.Message)" -ForegroundColor DarkYellow

                  $ProvisionedFailedCount++
              }
          }

          # ============================================================
          # Final verification
          # ============================================================

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "              UWP CLEANUP SUMMARY" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan

          Write-Host ""
          Write-Host "Installed AppX packages:"
          Write-Host "  Removed : $RemovedCount" -ForegroundColor Green
          Write-Host "  Kept    : $KeptCount" -ForegroundColor Green
          Write-Host "  Failed  : $FailedCount" -ForegroundColor Yellow

          Write-Host ""
          Write-Host "Provisioned AppX packages:"
          Write-Host "  Removed : $ProvisionedRemovedCount" -ForegroundColor Green
          Write-Host "  Kept    : $ProvisionedKeptCount" -ForegroundColor Green
          Write-Host "  Failed  : $ProvisionedFailedCount" -ForegroundColor Yellow

          Write-Host ""
          Write-Host "Remaining AppX packages:" -ForegroundColor Cyan
          Write-Host ""

          Get-AppxPackage -AllUsers |
              Sort-Object Name |
              Select-Object Name, PackageFullName |
              Format-Table -AutoSize

          Write-Host ""
          Write-Host "UWP / AppX cleanup completed." -ForegroundColor Green
          Write-Host ""

    - name: Delete Installer User Integration
      shell: pwsh
      run: |
        if ("${{ inputs.del-installer-user }}" -eq "true") {
            if (Get-LocalUser -Name "installer" -ErrorAction SilentlyContinue) {
                Write-Host "Вырезаем процессы пользователя installer..."
                Get-Process -IncludeUserName | Where-Object { $_.UserName -like "*installer*" } | Stop-Process -Force -ErrorAction SilentlyContinue
                
                Write-Host "Удаляем учётную запись..."
                Remove-LocalUser -Name "installer" -ErrorAction SilentlyContinue
                
                if (Test-Path "C:\Users\installer") { 
                    Remove-Item -Path "C:\Users\installer" -Recurse -Force -ErrorAction SilentlyContinue 
                }
                Write-Host "[УСПЕХ] Юзер installer полностью удалён из системы."
            } else {
                Write-Host "Юзер installer не найден, система чиста."
            }
        }


    - name: Deploy Zen Browser (Auto Platform Detect)
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host "[SCANNING] Checking system processor architecture..."

        # Винда сама хранит тип проца в этой системной переменной
        $arch = $env:PROCESSOR_ARCHITECTURE
        Write-Host "[INFO] Detected architecture: $arch"

        # Настраиваем динамические ссылки на самый свежий релиз
        if ($arch -eq "ARM64") {
          Write-Host "[MATCH] Target is ARM64. Setting up native ARM version."
          $url = "https://github.com/zen-browser/desktop/releases/latest/download/zen.installer-arm64.exe"
          $fileName = "zen.installer-arm64.exe"
        } else {
          Write-Host "[MATCH] Target is x64. Setting up standard database version."
          $url = "https://github.com/zen-browser/desktop/releases/latest/download/zen.installer.exe"
          $fileName = "zen.installer.exe"
        }

        $installerPath = "$env:TEMP\$fileName"

        Write-Host "[DOWNLOAD] Fetching latest Zen Browser from: $url"
        Invoke-WebRequest -Uri $url -OutFile $installerPath

        if (Test-Path $installerPath) {
          Write-Host "[INSTALL] Running Zen Browser silent installer..."
          try {
            # Запуск тихой установки без вызова окон
            Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait -NoNewWindow -ErrorAction Stop
            Write-Host "[SUCCESS] Zen Browser ($arch) installed successfully!"
            Remove-Item -Path $installerPath -Force
          }
          catch {
            Write-Warning "Failed to install Zen Browser for $arch"
            Write-Warning $_
          }
        }
        else {
          Write-Warning "Failed to download Zen Browser installer for $arch"
        }


    - name: Purge Windows System Services & Telemetry
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        
        # Красивая шапка лога
        Write-Host "======================================================================"
        Write-Host "      [SYSTEM DETOX] TERMINATING & DISABLING WINDOWS SERVICES         "
        Write-Host "======================================================================"

        # Список системного мусора (Служба -> Понятное имя для лога)
        $sysServices = [ordered]@{
            "WSearch"       = "Windows Search (Disk Indexer)"
            "DiagTrack"     = "Connected User Experiences & Telemetry (Spyware)"
            "WerSvc"        = "Windows Error Reporting"
            "SysMain"       = "SysMain (SuperFetch Agent)"
            "wuauserv"      = "Windows Update Service"
            "dmwappushservice" = "Device Management Wireless Application Telemetry"
            "MapsBroker"    = "Downloaded Maps Manager"
            "XblAuthManager"= "Xbox Live Authentication Manager"
            "XblGameSave"   = "Xbox Live Game Save Service"
            "XboxNetApiSvc" = "Xbox Live Networking Service"
            "XboxGipSvc"    = "Xbox Accessory Management Service"
            "ParentalControls" = "Windows Parental Controls"
            "Fax"           = "Fax Service (Legacy Bloat)"
            "PrintSpooler"  = "Print Spooler (Printer Agent)"
            "BluetoothUserService" = "Bluetooth User Support Service"
            "OneSyncSvc"    = "Sync Host (Microsoft Account Telemetry)"
            "MessagingService" = "Messaging Service (UWP Bloat)"
            "PhoneSvc"      = "Phone Service"
            "SensorService" = "Sensor Service Agent"
            "WalletService" = "Wallet Service (Payment Agent)"
        }

        foreach ($id in $sysServices.Keys) {
            $description = $sysServices[$id]
            
            # Проверяем наличие службы, полностью скрывая системные ошибки
            $serviceExists = Get-Service -Name $id -ErrorAction SilentlyContinue

            if ($serviceExists) {
                Write-Host " >> [FREEZING] $id -- ($description)" -ForegroundColor Cyan
                
                # 1. Жестко останавливаем процесс службы (глушим stderr и stdout)
                Stop-Service -Name $id -Force -ErrorAction SilentlyContinue > $null 2>&1
                
                # 2. Используем sc config для отключения автозапуска (start= disabled)
                # Важно: после start= ОБЯЗАТЕЛЬНО должен идти пробел, это синтаксис sc.exe!
                sc.exe config $id start= disabled > $null 2>&1

                # Проверяем успешность операции
                $status = Get-Service -Name $id -ErrorAction SilentlyContinue
                if ($status.StartType -eq 'Disabled') {
                    Write-Host "    [STATUS] >> [MUTED] $id is now completely DEAD." -ForegroundColor Green
                } else {
                    Write-Host "    [STATUS] >> [WARNING] $id partially locked but suppressed." -ForegroundColor Yellow
                }
            } else {
                # Если службы уже нет (например, на чистом ARM-раннере), выводим красивый пропуск
                Write-Host " >> [SKIP] $id -- Not found on this platform." -ForegroundColor Gray
            }
            Write-Host "----------------------------------------------------------------------"
        }

        Write-Host "======================================================================"
        Write-Host "      [SUCCESS] All target system services have been neutralized!     "
        Write-Host "======================================================================"

    # ============================================================
    # STOP KNOWN UNWANTED SERVICES
    # ============================================================

    - name: Stop unwanted services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'PostgreSQL',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {
          $service = Get-Service -Name $name -ErrorAction SilentlyContinue

          if ($null -ne $service) {
            Write-Host "[STOP] $name"

            try {
              Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
            }
            catch {
              Write-Warning "Failed to stop service: $name"
            }
          }
        }


