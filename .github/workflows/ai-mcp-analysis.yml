name: Total Local Ollama + MCP Review (All Branches)

on:
  workflow_dispatch: 
  push:
    branches:
      - '**' 
    paths:
      - '**/action.yml' 


# Даем полные права на чтение кода и пуш обновленного отчета ИИ обратно в ветку
permissions:
  contents: write

jobs:
  ollama_universal_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем всю историю, чтобы гит не ругался при пуше в динамическую ветку

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

#      - name: 🔧 Setup 8GB Swap for 32B Model
#        run: |
#          echo "🚀 Выделяем 8GB Swap..."
#          sudo swapoff -a || true
#          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
#         sudo chmod 600 /swapfile
#          sudo mkswap /swapfile
#          sudo swapon /swapfile
#          free -h
        
      - name: Install Ollama Server
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Install MCP Filesystem Server
        run: npm install -g @modelcontextprotocol/server-filesystem
        
      - name: Configure and Start Ollama
        run: |
          export OLLAMA_NUM_PARALLEL=1
          sudo fuser -k 11434/tcp || sudo lsof -t -i:11434 | xargs -r sudo kill -9 || true
          sleep 2
          ollama serve &
          sleep 5
          echo "Загружаем Qwen 2.5 Coder 14B на серверные мощности..."
          ollama pull qwen2.5-coder:14b-instruct

      - name: Initialize Filesystem MCP Server Config
        run: |
          mkdir -p ~/.config/mcp
          echo '{
            "mcpServers": {
              "filesystem": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-filesystem", "'$(pwd)'"]
              }
            }
          }' > ~/.config/mcp/config.json

      - name: Execute Heavy AI MCP Analysis
        id: ai_review
        run: |
          # Устанавливаем SDK локально прямо на раннере
          npm install @modelcontextprotocol/sdk @modelcontextprotocol/server-filesystem
          
          # Запускаем скрипт, явно передавая переменной окружения абсолютный путь к корню репозитория
          REPO_PATH="$GITHUB_WORKSPACE" node .github/scripts/ollama-mcp-review.js

      - name: Commit and Push AI Reports to Active Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
              
          # Добавляем всю папку с отчетами
          git add ai-reports/
          
          # Проверяем, есть ли что коммитить (если изменений нет, git diff по индексу спасет)
          if git diff --cached --quiet; then
            echo "No changes detected in ai-reports/. Skipping commit."
          else
          git commit -m "chore: add AI analysis report for branch '${{ github.ref_name }}' [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          fi
